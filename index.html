<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Reto diario: siete preguntas y, cuanto más nicho tu respuesta, más bajas por el iceberg.">
<meta name="theme-color" content="#eecedc">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧊</text></svg>">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Sabihondo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Nunito:wght@200..1000&family=Sixtyfour&display=swap">

<style>
/* ══ Sabihondo · identidad ══════════════════════════════════════
   Un solo mundo, a propósito: cielo polar arriba, mar oscuro abajo
   y un iceberg en sección que se oscurece capa a capa.            */
:root{
  color-scheme:dark;
  --mar:#60aec7;          /* agua bajo la línea de flotación */
  --fondo:#1e2f48;        /* lo más hondo */
  --cielo:#eecedc;
  --hielo:#ffffff;        /* la tarjeta */
  --tinta:#102f51;
  --tinta-suave:#4a6378;
  --linea:#333738;
  --boya:#e557cb;         /* acento */
  --boya-hondo:#b04dad;   /* el acento como texto sobre la tarjeta */
  --boya-tinta:#102f51;   /* texto encima del acento */
  --espuma:#e6f2f7;
  --niebla:#8fb0c4;

  /* franjas del iceberg, de la punta al fondo */
  --c0:#ffffff; --c1:#d4eef8; --c2:#9dd6ec; --c3:#58abd6; --c4:#2d74ae; --c5:#173f7a;

  --r-btn:2px; --r-panel:0px;
  --col:minmax(320px,44%);
  --disp:"Arvo",Rockwell,Georgia,serif;
  --sans:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Sixtyfour",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--sans);font-size:15px;
  line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;font-variation-settings:"wdth" 100}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--boya);outline-offset:3px;border-radius:2px}
::selection{background:var(--boya);color:var(--boya-tinta)}

#app{height:100%;display:grid;grid-template-columns:var(--col) minmax(0,1fr);grid-template-rows:auto 1fr}

/* ── barra ───────────────────────────────────────────── */
#barra{grid-column:1 / -1;display:flex;align-items:center;gap:14px;
  padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:var(--cielo);color:var(--tinta);border-bottom:1px solid var(--linea)}
#marca{font-family:var(--disp);font-weight:850;font-size:20px;letter-spacing:0;
  font-variation-settings:"wdth" 120}
#marca em{font-style:normal;color:var(--boya-hondo)}
#dia{font-family:var(--mono);font-size:11px;color:var(--tinta-suave);letter-spacing:.08em;
  text-transform:uppercase;padding-left:12px;border-left:1px solid var(--linea)}
#barra .sep{flex:1}
.icono{width:34px;height:34px;border:1px solid var(--linea);border-radius:50%;color:var(--tinta-suave);
  display:grid;place-items:center;font-size:14px;font-weight:700;background:#fff;transition:.15s}
.icono:hover,.icono[aria-pressed="true"]{color:var(--boya-hondo);border-color:var(--boya)}

/* ── el iceberg ──────────────────────────────────────── */
#hielo{position:relative;overflow:hidden;background:var(--fondo)}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#svg text{font-family:var(--mono)}

/* ── escena ──────────────────────────────────────────── */
#escena{overflow-y:auto;overscroll-behavior:contain;padding:28px 24px 32px;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--mar) 0%,var(--fondo) 100%)}
.panel{width:100%;max-width:560px;margin:auto;background:var(--hielo);border-radius:var(--r-panel);padding:28px 30px 26px;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.rotulo{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tinta-suave);margin:0 0 6px}
h1{font-family:var(--disp);font-weight:900;font-size:clamp(42px,7vw,68px);line-height:.9;margin:0;
  letter-spacing:0;font-variation-settings:"wdth" 125;color:var(--tinta)}
h1 em{font-style:normal;color:var(--boya)}
.lema{font-size:18px;margin:16px 0 0;text-wrap:pretty;max-width:44ch}
.lema b{color:var(--boya-hondo)}
.apunte{color:var(--tinta-suave);font-size:13.5px;margin:10px 0 0;max-width:56ch}
.apunte b{color:var(--tinta)}

.reglas{list-style:none;margin:22px 0 0;padding:16px 0 0;border-top:1px solid var(--linea);display:grid;gap:10px}
.reglas li{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:baseline;font-size:14px;color:var(--tinta-suave)}
.reglas b{color:var(--tinta);font-weight:650}
.reglas .num{font-family:var(--disp);font-weight:850;font-size:20px;color:var(--tinta);font-variation-settings:"wdth" 115;
  font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

.botonera{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;align-items:center}
.btn{font-family:var(--disp);font-weight:750;font-size:15px;letter-spacing:.02em;font-variation-settings:"wdth" 110;
  padding:12px 22px;border-radius:var(--r-btn);background:var(--boya);color:var(--boya-tinta);border:1px solid var(--boya);transition:.15s}
.btn:hover{filter:brightness(.92)}
.btn.fantasma{background:none;color:var(--tinta);border-color:var(--linea)}
.btn.fantasma:hover{border-color:var(--tinta-suave);background:#fff}
.racha{font-family:var(--mono);font-size:11px;color:var(--tinta-suave);letter-spacing:.08em;text-transform:uppercase}

/* ── ronda ───────────────────────────────────────────── */
.cabecera{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tinta-suave);border-bottom:1px solid var(--linea);padding-bottom:11px;margin-bottom:20px}
.cabecera .m{color:var(--boya-hondo);font-weight:600;font-variant-numeric:tabular-nums}
.enunciado{font-family:var(--disp);font-weight:800;font-size:clamp(24px,3.6vw,34px);line-height:1.1;
  margin:0;text-wrap:balance;font-variation-settings:"wdth" 105;letter-spacing:0}

form{margin-top:22px;display:flex;gap:9px;flex-wrap:wrap}
input[type=text],input[type=email],input[type=password]{flex:1 1 180px;min-width:0;background:#fff;border:1.5px solid var(--linea);border-radius:var(--r-btn);
  color:var(--tinta);padding:13px 18px;font-family:var(--sans);font-size:17px;color-scheme:light}
input::placeholder{color:#8aa0b1}
input[type=text]:focus,input[type=email]:focus,input[type=password]:focus{outline:none;border-color:var(--boya);box-shadow:0 0 0 3px color-mix(in srgb,var(--boya) 22%,transparent)}
.reloj{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-top:18px}
.mecha{height:10px;background:color-mix(in srgb,var(--tinta) 10%,transparent);border-radius:var(--r-btn);overflow:hidden}
.mecha i{display:block;height:100%;background:var(--boya);transform-origin:left;transition:transform .1s linear,background .3s}
.segundos{font-family:var(--disp);font-weight:700;font-size:28px;line-height:1;min-width:2.4ch;text-align:right;
  font-variant-numeric:tabular-nums;color:var(--tinta)}
.segundos small{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--tinta-suave);margin-left:2px}
.reloj.urge .mecha i{background:#e5484d}
.reloj.urge .segundos{color:#e5484d;animation:late 1s steps(2) infinite}
@keyframes late{50%{opacity:.45}}
.aviso{margin:11px 0 0;font-size:13.5px;color:var(--boya-hondo);min-height:20px}
.sacudir{animation:sac .34s}
@keyframes sac{25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* ── veredicto ───────────────────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;padding:5px 11px 5px 9px;border-radius:999px;background:#fff;
  border:1px solid var(--linea)}
.chip i{width:10px;height:10px;border-radius:50%;display:block}
.tuya{font-family:var(--disp);font-weight:850;font-size:clamp(30px,5vw,42px);line-height:1.05;margin:14px 0 0;
  font-variation-settings:"wdth" 110;letter-spacing:0}
.tuya.nada{color:var(--tinta-suave)}
.coña{color:var(--tinta-suave);font-size:14px;font-style:italic;margin:8px 0 0;max-width:46ch;text-wrap:pretty}
.baja{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--linea)}
.baja b{font-family:var(--disp);font-weight:900;font-size:28px;color:var(--boya-hondo);font-variant-numeric:tabular-nums}
.baja span{font-size:14px;color:var(--tinta-suave)}
.baja span strong{color:var(--tinta)}

.nivel{display:inline-flex;align-items:baseline;gap:10px;background:var(--nc);color:var(--nt);
  border-radius:999px;padding:7px 16px 7px 14px}
.nivel-n{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.nivel-t{font-family:var(--disp);font-weight:850;font-size:19px;font-variation-settings:"wdth" 112}
.escalera{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:260px}
.escalera li{height:22px;border-radius:3px;background:var(--nc);opacity:.22;display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;font-weight:600;color:var(--tinta)}
.escalera li.on{opacity:1;color:#fff;box-shadow:0 0 0 2px var(--hielo),0 0 0 4px var(--nc)}
.escalera li:first-child.on{color:var(--tinta)}
.expl{font-size:16px;margin:8px 0 0;max-width:46ch;text-wrap:pretty;color:var(--tinta)}
.tag{display:inline-block;margin-top:4px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;background:var(--nc);color:var(--nt);border-radius:999px;padding:2px 9px;white-space:nowrap}

/* ── cuenta ──────────────────────────────────────────── */
.cuenta-btn{height:34px;min-width:34px;padding:0 14px;border-radius:999px;background:var(--tinta);color:#fff;
  font-family:var(--disp);font-weight:750;font-size:14px;font-variation-settings:"wdth" 110;transition:.15s}
.cuenta-btn:hover{background:var(--boya-hondo)}
.cuenta-btn.dentro{padding:0;width:34px;background:var(--boya);color:var(--boya-tinta);font-size:15px}
.pestanas{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#fff;border:1px solid var(--linea);
  border-radius:var(--r-btn);padding:4px;margin-top:18px}
.pestanas button{border-radius:var(--r-btn);padding:8px 10px;font-weight:650;font-size:14px;color:var(--tinta-suave)}
.pestanas button[aria-selected="true"]{background:var(--tinta);color:#fff}
.form-cuenta{display:grid;gap:6px;margin-top:16px}
.form-cuenta label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-suave);margin-top:6px}
.form-cuenta .btn{margin-top:12px;justify-self:start}
.form-cuenta .btn:disabled{opacity:.5;cursor:wait}
.aviso-cuenta{margin-top:18px;padding:12px 14px;background:#fff;border:1px solid var(--linea);border-radius:6px;max-width:none}
.enlace{color:var(--boya-hondo);font-weight:650;text-decoration:underline;text-underline-offset:2px;padding:0}
.historial{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--linea)}
.historial li{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--linea)}
.h-dia{font-family:var(--disp);font-weight:800;font-size:15px;line-height:1.1}
.h-dia small{display:block;font-family:var(--mono);font-weight:400;font-size:10.5px;color:var(--tinta-suave)}
.h-nv{display:flex;gap:3px;flex-wrap:wrap}
.h-nv i{width:14px;height:14px;border-radius:3px;display:block}
.h-m{font-family:var(--mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}

/* ── resultado ───────────────────────────────────────── */
.hondura{font-family:var(--disp);font-weight:900;font-size:clamp(56px,11vw,92px);line-height:.88;margin:6px 0 0;
  font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 118;letter-spacing:0}
.hondura small{font-size:.32em;color:var(--tinta-suave);font-weight:600;margin-left:6px;letter-spacing:0}
.capa-final{font-family:var(--disp);font-weight:800;font-size:20px;margin:10px 0 0;color:var(--boya-hondo);
  font-variation-settings:"wdth" 110}
.tira{list-style:none;margin:18px 0 0;padding:0;border-top:1px solid var(--linea)}
.tira li{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:baseline;padding:10px 2px;
  border-bottom:1px solid var(--linea);font-size:14px}
.tira .pt-c{width:10px;height:10px;border-radius:50%;align-self:center}
.tira .pr{color:var(--tinta-suave);font-size:12px;display:block;line-height:1.3;margin-bottom:1px}
.tira .ver{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;text-align:left;padding:0;cursor:pointer}
.tira .ver:hover{color:var(--tinta)}
.tira .flecha{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--boya-hondo);
  border-bottom:1px dotted currentColor}
.tira .ver[aria-expanded="true"] .flecha{color:var(--tinta-suave)}
.tira .ver[aria-expanded="true"] .flecha::after{content:" ↑"}
.tira .ver[aria-expanded="false"] .flecha::after{content:" ↓"}
.todas[hidden]{display:none}
.todas{grid-column:1 / -1;display:grid;gap:10px;background:#fff;border:1px solid var(--linea);border-radius:6px;
  padding:12px 14px;margin:4px 0 2px}
.grupo-cab{display:flex;justify-content:space-between;align-items:center;gap:10px}
.resps{margin:6px 0 0;font-size:13.5px;line-height:1.6;color:var(--tinta)}
.resps .mas{color:var(--tinta-suave);font-style:italic}
.resps mark{background:none;color:var(--tinta);font-weight:700;box-shadow:inset 0 -3px 0 var(--nc);padding:0 1px}
.tira .rs{font-weight:650}
.tira .rs.falla{color:var(--tinta-suave);font-weight:400;font-style:italic}
.tira .joya{color:var(--boya-hondo);font-size:12px;display:block;margin-top:2px}
.tira .pt{font-family:var(--mono);color:var(--tinta-suave);font-variant-numeric:tabular-nums;font-size:12px}
.marcador{display:flex;gap:24px;flex-wrap:wrap;margin-top:20px}
.marcador div{font-family:var(--mono);font-size:10.5px;color:var(--tinta-suave);letter-spacing:.1em;text-transform:uppercase}
.marcador b{display:block;font-family:var(--disp);font-size:26px;color:var(--tinta);letter-spacing:0;
  text-transform:none;font-variant-numeric:tabular-nums;margin-top:2px;font-weight:850}
.copiado{color:var(--boya-hondo);font-size:13px;font-family:var(--mono)}

/* ── ayuda ───────────────────────────────────────────── */
#ayuda[hidden],#cuenta[hidden]{display:none}
#ayuda,#cuenta{position:fixed;inset:0;z-index:8;background:rgba(3,13,27,.82);backdrop-filter:blur(4px);
  display:flex;flex-direction:column;padding:20px 16px;overflow-y:auto}
h2{font-family:var(--disp);font-weight:850;font-size:28px;margin:0 0 4px;font-variation-settings:"wdth" 115}
h3{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--boya-hondo);
  margin:24px 0 8px;font-weight:600}
.mini{color:var(--tinta-suave);font-size:14px;margin:8px 0 0;max-width:60ch}
.mini b{color:var(--tinta)}
.escala{list-style:none;margin:10px 0 0;padding:0;border:1px solid var(--linea);border-radius:6px;overflow:hidden}
.escala li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 13px;
  font-size:14px;background:#fff}
.escala li+li{border-top:1px solid var(--linea)}
.escala .pt-c{width:12px;height:12px;border-radius:50%}
.escala .n{font-weight:700}
.escala .d{color:var(--tinta-suave);font-size:12.5px;display:block}
.escala .p{font-family:var(--mono);font-size:12px;color:var(--tinta-suave);font-variant-numeric:tabular-nums}

@media (max-width:720px){
  :root{--col:92px}
  #barra{padding-inline:14px;gap:10px}
  #marca{font-size:18px}
  #dia{padding-left:10px;font-size:10px}
  #escena{padding:18px 16px 24px}
  .panel{padding:22px 18px 20px}
  .lema{font-size:16px}
  .reglas li{grid-template-columns:54px 1fr;gap:10px}
  .reglas .num{font-size:17px}
  h1{font-size:40px}
  .btn{padding:11px 18px}
}
@media (max-width:380px){ #dia{display:none} }
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="app">
  <header id="barra">
    <span id="marca">Sabi<em>hondo</em></span>
    <span id="dia">—</span>
    <span class="sep"></span>
    <button class="icono" id="bSon" aria-pressed="false" title="Sonido">♪</button>
    <button class="icono" id="bAyuda" title="Cómo se juega">?</button>
    <button class="cuenta-btn" id="bCuenta" hidden>Entrar</button>
  </header>
  <div id="hielo" aria-hidden="true"><svg id="svg"></svg></div>
  <main id="escena"></main>
</div>
<div id="ayuda" hidden></div>

 The Office","n":53},{"q":"Nombra una serie de Netflix","n":1416},{"q":"Nombra una serie de Prime Video","n":74},{"q":"Nombra una sitcom","n":1769},{"q":"Nombra una película española","n":6183},{"q":"Nombra una película de Disney","n":343},{"q":"Nombra una película de Marvel","n":81},{"q":"Nombra una película basada en un libro","n":2709},{"q":"Nombra un director o directora de cine","n":3447},{"q":"Nombra un cantante o una cantante internacional","n":2129},{"q":"Nombra un grupo de música español","n":1990},{"q":"Nombra un festival de música","n":1213},{"q":"Nombra un musical","n":46},{"q":"Nombra un dios o una diosa griega","n":779},{"q":"Nombra un ser mitológico","n":1812},{"q":"Nombra una obra de arte","n":829},{"q":"Nombra un edificio famoso","n":193},{"q":"Nombra un rascacielos","n":2758},{"q":"Nombra un monumento famoso","n":121},{"q":"Nombra una red social","n":258},{"q":"Nombra una aplicación de mensajería","n":186},{"q":"Nombra una aplicación de música","n":75},{"q":"Nombra una marca de ordenadores","n":29},{"q":"Nombra una marca de relojes","n":33},{"q":"Nombra una marca de lujo","n":38},{"q":"Nombra una marca de zapatillas","n":38},{"q":"Nombra un banco","n":137},{"q":"Nombra una cadena de restaurantes","n":942},{"q":"Nombra una cadena hotelera","n":397},{"q":"Nombra una discoteca famosa","n":594},{"q":"Nombra una fiesta de España","n":294},{"q":"Nombra una enfermedad infecciosa","n":688}];</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
/* ═════════ constantes ═════════ */
const RONDAS = 7, MS_RESP = 25000;
const FONDO = 700;                 // metros: siete joyas seguidas = el fondo del iceberg
const FLOTACION = 70;              // el 10 % asoma, el 90 % queda debajo
const EPOCA = "2026-08-31";        // día 1

// Cinco niveles según lo rara que sea la respuesta (puntos = metros que bajas)
const NIVELES = [
  {n:"Superficie", pts:10,  col:"#c3ced8", txt:"#0a1f35", e:"⬜", d:"Lo primero que se le pasa a cualquiera por la cabeza."},
  {n:"Conocido",   pts:30,  col:"#2fb5a2", txt:"#ffffff", e:"🟩", d:"No es lo primero que sale, pero casi todo el mundo lo sabe."},
  {n:"Raro",       pts:60,  col:"#2f7fd6", txt:"#ffffff", e:"🟦", d:"Aquí ya hay que haberse fijado. Mucha gente no caería."},
  {n:"Muy raro",   pts:85,  col:"#7b4fd6", txt:"#ffffff", e:"🟪", d:"Esto es de alguien que sabe del tema de verdad."},
  {n:"Sabihondo",  pts:100, col:"#e5484d", txt:"#ffffff", e:"🟧", d:"Casi nadie lo sabe. Es la joya del día."}
];
// cada respuesta guarda su nivel en `nv` (0-4); las partidas antiguas traían `tier` (0-5, con el «listillo»)
const NIVEL_ANTIGUO = [0,0,1,2,3,4];
function idxNivel(r){
  if (!r) return null;
  if (typeof r.nv === "number") return r.nv;
  if (typeof r.tier === "number") return NIVEL_ANTIGUO[r.tier];
  return null;
}
const nivel = r => { const i = idxNivel(r); return i === null ? null : NIVELES[i]; };
const numNivel = r => idxNivel(r) + 1;
const FALLO = "❌";

// Franjas del iceberg (solo color: cuanto más hondo, más oscuro)
const CAPAS = [
  {m:0,col:"#ffffff"},{m:70,col:"#d4eef8"},{m:150,col:"#9dd6ec"},
  {m:250,col:"#58abd6"},{m:350,col:"#2d74ae"},{m:450,col:"#173f7a"}
];

/* ═════════ utilidades ═════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mil = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");

function norm(s){
  s = s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  s = s.replace(/[^a-z0-9ñ]+/g," ");
  const fuera = new Set(["el","la","los","las","lo","un","una","unos","unas","de","del","al","a","en","y","o"]);
  return s.split(" ").filter(w => w && !fuera.has(w)).join(" ");
}
function lev(a,b){
  if (Math.abs(a.length-b.length) > 2) return 9;
  let prev = Array.from({length:b.length+1},(_,i)=>i);
  for (let i=1;i<=a.length;i++){
    const fila=[i];
    for (let j=1;j<=b.length;j++)
      fila[j]=Math.min(prev[j]+1, fila[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=fila;
  }
  return prev[b.length];
}
/* PRNG determinista: todo el mundo recibe las mismas preguntas */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hoyMadrid = () => new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Madrid",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
function numeroDia(f){
  const [ay,am,ad]=EPOCA.split("-").map(Number), [y,m,d]=f.split("-").map(Number);
  return Math.round((Date.UTC(y,m-1,d)-Date.UTC(ay,am-1,ad))/864e5)+1;
}
function eligeRondas(semilla){
  const r = mulberry(semilla), idx = PREGUNTAS.map((_,i)=>i);
  for (let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
  return idx.slice(0,RONDAS);
}
/* almacén local; hereda rachas y partidas de cuando se llamaba Krillón */
const guarda = {
  get(k,d){
    try{
      const v = localStorage.getItem("sabihondo:"+k) ?? localStorage.getItem("krillon:"+k);
      return v ? JSON.parse(v) : d;
    }catch{return d}
  },
  set(k,v){try{localStorage.setItem("sabihondo:"+k,JSON.stringify(v))}catch{}}
};

/* ═════════ evaluación de una respuesta ═════════ */
const compacta = s => norm(s).replace(/ /g,"");
function evalua(pregunta, texto){
  const q = compacta(texto);
  if (!q) return null;
  for (let t=0;t<5;t++)
    for (const [disp,claves] of pregunta.t[t])
      if (claves.includes(q)) return {nv:t, disp};
  // tolerancia a erratas, solo en palabras con cuerpo
  let mejor=null;
  for (let t=0;t<5;t++)
    for (const [disp,claves] of pregunta.t[t])
      for (const k of claves){
        if (k.length < 5) continue;
        const tope = k.length >= 9 ? 2 : 1, d = lev(q,k);
        if (d <= tope && (!mejor || d < mejor.d)) mejor = {d, r:{nv:t, disp}};
      }
  return mejor ? mejor.r : null;
}
const joyasDe = p => p.t[4].slice(0,3).map(x => x[0]);

/* ═════════ el iceberg (SVG) ═════════ */
const NS = "http://www.w3.org/2000/svg";
const svg = $("#svg");
let G = null;                       // geometría actual
let profVista = 0, profMeta = 0, pines = [];

// Perfil del iceberg: [metros, borde izquierdo, borde derecho] en fracción del ancho útil
const IZQ = [[0,.46],[10,.42],[22,.40],[34,.33],[50,.29],[62,.24],[70,.20],
  [90,.11],[140,.04],[230,.02],[300,.07],[380,.03],[450,.09],[530,.16],[600,.27],[660,.37],[700,.47]];
const DER = [[0,.48],[8,.53],[20,.55],[32,.61],[46,.63],[60,.70],[70,.76],
  [95,.86],[150,.94],[220,.98],[310,.93],[390,.97],[460,.91],[540,.85],[610,.77],[670,.64],[700,.53]];

function geometria(){
  const r = $("#hielo").getBoundingClientRect();
  const W = r.width, H = r.height, estrecho = W < 200;
  const arriba = Math.max(34, H*.07), abajo = 18;
  const L = estrecho ? 6 : 18, R = estrecho ? W-6 : W*.66;
  // la punta se dibuja algo más alta de lo real para que se lea; el resto va a escala
  const alto = H-arriba-abajo, corte = .15;
  const y = m => arriba + (m <= FLOTACION ? (m/FLOTACION)*corte : corte + ((m-FLOTACION)/(FONDO-FLOTACION))*(1-corte)) * alto;
  const x = f => L + f*(R-L);
  return {W,H,estrecho,y,x,L,R};
}

function el(tag, attrs, padre){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (padre) padre.appendChild(e);
  return e;
}

function dibujaIceberg(){
  G = geometria();
  const {W,H,estrecho,y,x} = G;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = "";
  const defs = el("defs",{},svg);
  const gm = el("linearGradient",{id:"gMar",x1:0,y1:0,x2:0,y2:1},defs);
  const tk = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  el("stop",{offset:0,"stop-color":tk("--mar")},gm);
  el("stop",{offset:.45,"stop-color":tk("--mar")},gm);
  el("stop",{offset:1,"stop-color":tk("--fondo")},gm);
  const gc = el("linearGradient",{id:"gCielo",x1:0,y1:0,x2:0,y2:1},defs);
  el("stop",{offset:0,"stop-color":tk("--cielo")},gc);
  el("stop",{offset:1,"stop-color":tk("--cielo")},gc);

  const yf = y(FLOTACION);
  el("rect",{x:0,y:0,width:W,height:yf,fill:"url(#gCielo)"},svg);
  el("rect",{x:0,y:yf,width:W,height:H-yf,fill:"url(#gMar)"},svg);

  // contorno
  const izq = IZQ.map(([m,f]) => `${x(f).toFixed(1)},${y(m).toFixed(1)}`);
  const der = DER.slice().reverse().map(([m,f]) => `${x(f).toFixed(1)},${y(m).toFixed(1)}`);
  const puntos = izq.concat(der).join(" ");
  const cp = el("clipPath",{id:"cpHielo"},defs);
  el("polygon",{points:puntos},cp);

  // capas, recortadas por el contorno
  const capas = el("g",{"clip-path":"url(#cpHielo)"},svg);
  CAPAS.forEach((c,i) => {
    const y0 = y(c.m), y1 = i < CAPAS.length-1 ? y(CAPAS[i+1].m) : H;
    el("rect",{x:0,y:y0,width:W,height:y1-y0,fill:c.col},capas);
  });
  // lo que queda bajo el agua se ve un poco velado
  el("rect",{x:0,y:yf,width:W,height:H-yf,fill:"#062038",opacity:.14},capas);
  // vetas del hielo
  for (let k=0;k<26;k++){
    const m = 8 + k*26 + (k%3)*5, yy = y(m);
    el("line",{x1:0,y1:yy,x2:W,y2:yy+((k%2)?6:-4),stroke:m<FLOTACION?"#b9d6e2":"#ffffff","stroke-width":1,opacity:m<FLOTACION?.7:.12},capas);
  }
  el("polygon",{points:puntos,fill:"none",stroke:"#ffffff","stroke-width":1.2,opacity:.55},svg);

  // separación entre capas: raya que cruza todo el mar
  CAPAS.forEach((c,i) => {
    if (i === 0) return;
    const yy = y(c.m);
    el("line",{x1:0,y1:yy,x2:W,y2:yy,stroke:i===1?"#ffffff":"#8fb0c4","stroke-width":1,
      "stroke-dasharray":i===1?"0":"3 5",opacity:i===1?.9:.45},svg);
  });

  // línea de flotación, con oleaje
  let ola = `M0 ${yf}`;
  for (let xx=0; xx<=W+12; xx+=12) ola += ` Q${xx+6} ${yf-3} ${xx+12} ${yf}`;
  el("path",{d:ola,fill:"none",stroke:"#ffffff","stroke-width":2,opacity:.95},svg);

  if (!estrecho){
    const nota = el("text",{x:G.W-12,y:yf-8,"text-anchor":"end",fill:"#4a6378","font-size":9.5},svg);
    nota.textContent = "solo asoma el 10 %";
  }

  // grupo de pines y marcador
  el("g",{id:"pines"},svg);
  const mk = el("g",{id:"marca-tu"},svg);
  el("line",{x1:0,y1:0,x2:W,y2:0,stroke:tk("--boya"),"stroke-width":2},mk);
  el("circle",{cx:x(.5),cy:0,r:6,fill:tk("--boya"),stroke:"#ffffff","stroke-width":2},mk);
  const chip = el("g",{id:"chip"},mk);
  el("rect",{x:0,y:-11,width:10,height:22,rx:11,fill:tk("--boya")},chip);
  el("text",{x:0,y:4,fill:tk("--boya-tinta"),"font-size":estrecho?10:11,"font-weight":600},chip);

  pintaPines();
  mueveMarca();
}

function pintaPines(){
  const g = $("#pines"); if (!g || !G) return;
  g.innerHTML = "";
  const {y,x,estrecho} = G;
  let ultimoY = -99;
  pines.forEach((p,i) => {
    const yy = y(p.m);
    const cx = x(i % 2 ? .38 : .62);
    el("line",{x1:x(.5),y1:yy,x2:cx,y2:yy,stroke:"#ffffff","stroke-width":1,opacity:.5},g);
    el("circle",{cx,cy:yy,r:estrecho?4:5,fill:nivel(p)?nivel(p).col:"#1b2e44",stroke:"#ffffff","stroke-width":1.5},g);
    if (!estrecho){
      let ty = yy; if (ty - ultimoY < 17) ty = ultimoY + 17; ultimoY = ty;
      const texto = nivel(p) ? p.disp : "sin respuesta";
      const t = el("text",{x:cx + (i%2 ? -10 : 10),y:ty+3.5,"text-anchor":i%2?"end":"start",
        fill:"#0a1f35","font-size":10.5,"font-weight":600,"paint-order":"stroke",stroke:"#ffffff","stroke-width":3,
        "stroke-linejoin":"round"},g);
      t.textContent = texto.length > 26 ? texto.slice(0,25)+"…" : texto;
      // si no cabe por su lado, se pasa al otro lado del punto
      const largo = t.getComputedTextLength();
      if (i % 2 && cx - 10 - largo < 6){ t.setAttribute("text-anchor","start"); t.setAttribute("x", cx + 10); }
      else if (!(i % 2) && cx + 10 + largo > G.W - 6){ t.setAttribute("text-anchor","end"); t.setAttribute("x", cx - 10); }
    }
  });
}

function mueveMarca(){
  if (!G) return;
  const mk = $("#marca-tu"); if (!mk) return;
  const yy = G.y(Math.min(FONDO, profVista));
  mk.setAttribute("transform", `translate(0 ${yy.toFixed(1)})`);
  const chip = $("#chip"), txt = chip.lastElementChild, caja = chip.firstElementChild;
  txt.textContent = G.estrecho ? mil(profVista)+" m" : "tú · " + mil(profVista) + " m";
  const ancho = txt.getComputedTextLength() + 16;
  const cx = G.estrecho ? G.W - ancho - 4 : 10;
  caja.setAttribute("x", cx); caja.setAttribute("width", ancho);
  txt.setAttribute("x", cx + 8);
  chip.setAttribute("transform", yy < 30 ? "translate(0 14)" : "");
}

function anima(){
  if (Math.abs(profMeta-profVista) > .3){ profVista += (profMeta-profVista)*.06; mueveMarca(); }
  else if (profVista !== profMeta){ profVista = profMeta; mueveMarca(); }
  requestAnimationFrame(anima);
}
new ResizeObserver(() => dibujaIceberg()).observe($("#hielo"));

/* ═════════ sonido ═════════ */
const Son = (()=>{
  let ac=null, on = guarda.get("son", true);
  const arranca = () => { if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch{}} ac&&ac.state==="suspended"&&ac.resume(); };
  function tono(f,dur,vol,tipo="sine",desliz){
    if(!on||!ac) return;
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
    o.type=tipo; o.frequency.setValueAtTime(f,t);
    if(desliz) o.frequency.exponentialRampToValueAtTime(desliz,t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+.03);
  }
  return {
    arranca, activo:()=>on,
    alterna(){ on=!on; guarda.set("son",on); if(on){arranca();tono(520,.1,.05)} return on; },
    baja(t){ tono(880-t*60,.9,.05,"sine",300-t*30) },
    capa(){ tono(1320,.35,.04,"triangle",990) },
    fallo(){ tono(150,.22,.05,"square",90) },
    tic(){ tono(1300,.045,.028,"triangle") },
    fondo(){ tono(110,2,.08,"sine",55) }
  };
})();

/* ═════════ estado ═════════ */
let J = null;

/* cada pregunta vive en su propio archivo (banco/NN.json): solo se bajan las del día */
const CACHE_PREG = new Map();
function cargaPregunta(i){
  if (!CACHE_PREG.has(i)) CACHE_PREG.set(i, fetch("banco/" + String(i).padStart(2,"0") + ".json")
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .catch(e => { CACHE_PREG.delete(i); throw e; }));
  return CACHE_PREG.get(i);
}
async function empieza(modo, boton){
  Son.arranca();
  const texto = boton?.textContent;
  if (boton){ boton.disabled = true; boton.textContent = "Cargando…"; }
  try{ J = await nuevaPartida(modo); ronda(); }
  catch{
    if (boton){ boton.disabled = false; boton.textContent = texto; }
    alertaCarga();
  }
}
function alertaCarga(){
  const a = document.createElement("p"); a.className = "aviso"; a.textContent = "No se han podido cargar las preguntas. Revisa la conexión y vuelve a probar.";
  escena.querySelector(".panel")?.appendChild(a);
}

async function nuevaPartida(modo){
  const fecha = hoyMadrid(), dia = numeroDia(fecha);
  const semilla = modo === "libre" ? (Date.now() & 0x7fffffff) : dia * 7919;
  const rondas = await Promise.all(eligeRondas(semilla).map(cargaPregunta));
  return { modo, fecha, dia, rondas, i:0, res:[], puntos:0 };
}
function fijaPines(res){
  let acc = 0;
  pines = res.map(r => { acc += nivel(r) ? nivel(r).pts : 0; return {m:acc, nv:idxNivel(r), disp:r.disp}; });
  pintaPines();
}

/* ═════════ pantallas ═════════ */
const escena = $("#escena");
const cabecera = () => `
  <div class="cabecera">
    <span>${J.modo==="libre" ? "Libre" : "Nº "+J.dia} · ronda ${J.i+1}/${RONDAS}</span>
    <span class="m">${mil(J.puntos)} m</span>
  </div>`;

function portada(){
  pantalla = "portada";
  const est = stats();
  const hecho = hechoHoy();
  $("#dia").textContent = "Reto nº " + numeroDia(hoyMadrid());
  profMeta = 0; fijaPines([]);

  escena.innerHTML = `
  <div class="panel">
    <p class="rotulo">El reto diario · ${esc(hoyMadrid().split("-").reverse().join("/"))}</p>
    <h1>Sabi<em>hondo</em></h1>
    <p class="lema">Siete preguntas al día, las mismas para todo el mundo. Vale cualquier respuesta correcta, pero lo obvio te deja en la punta del iceberg. <b>Cuanto más nicho, más bajas.</b></p>
    <ul class="reglas">
      <li><span class="num">7</span><span><b>Rondas.</b> Enunciados abiertos: «Nombra una provincia de España», «Nombra un Pokémon de la primera generación».</span></li>
      <li><span class="num">25 s</span><span><b>Por ronda</b>, y una sola respuesta.</span></li>
      <li><span class="num">700 m</span><span><b>El fondo del iceberg.</b> Llegas con siete joyas seguidas. Si solo dices lo obvio, te quedas en 70 m, justo en la línea de flotación.</span></li>
    </ul>
    <div class="botonera">
      ${hecho ? `<button class="btn" id="bVer">Ver tu iceberg de hoy</button>`
              : `<button class="btn" id="bJugar">Empezar a bajar</button>`}
      <button class="btn fantasma" id="bLibre">Partida libre</button>
      ${est.racha ? `<span class="racha">Racha: ${est.racha} ${est.racha>1?"días":"día"}</span>` : ``}
    </div>
    ${hecho ? `<p class="apunte" style="margin-top:16px">Hoy ya has bajado <b>${mil(hecho.puntos)} m</b>. El siguiente reto sale a medianoche.</p>` : ``}
  </div>`;

  $("#bJugar")?.addEventListener("click", e => empieza("diaria", e.currentTarget));
  $("#bVer")?.addEventListener("click", () => { J = {modo:"diaria", ...hecho, revisita:true}; final(); });
  $("#bLibre").addEventListener("click", e => empieza("libre", e.currentTarget));
}

let temporizador = null;
function paraReloj(){ if (temporizador){ cancelAnimationFrame(temporizador); temporizador = null; } }

function ronda(){
  pantalla = "juego";
  // partida nueva: el iceberg vuelve a la punta y sin las respuestas de la anterior
  if (J.i === 0){ profMeta = 0; fijaPines([]); }
  responder();
}

function responder(){
  paraReloj();
  const p = J.rondas[J.i];
  escena.innerHTML = `
  <div class="panel" id="tarjeta">
    ${cabecera()}
    <p class="rotulo">Enunciado</p>
    <p class="enunciado">${esc(p.q)}</p>
    <form id="f" autocomplete="off">
      <input type="text" id="r" placeholder="tu respuesta" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
      <button class="btn" type="submit">Bajar</button>
    </form>
    <div class="reloj" id="reloj" role="timer" aria-label="Tiempo para responder">
      <div class="mecha"><i style="transform:scaleX(1)"></i></div>
      <span class="segundos"><span id="seg">${MS_RESP/1000}</span><small>s</small></span>
    </div>
    <p class="aviso" id="aviso"></p>
  </div>`;

  const campo = $("#r"); campo.focus();
  const barra = $("#reloj"), relleno = barra.querySelector(".mecha i"), seg = $("#seg");
  const t0 = performance.now(); let ultimoTic = 99;

  let terminada = false, consultando = false;
  const acaba = r => { if (terminada) return; terminada = true; cierra(r); };

  function rechaza(texto){
    Son.fallo();
    $("#aviso").innerHTML = "«" + esc(texto) + "» no está en la lista. Prueba con otra."
      + (Cuenta.sb ? ` <button type="button" class="enlace" id="bSug">¿Es correcta? Avísanos</button>` : "");
    $("#bSug")?.addEventListener("click", async e => {
      const b = e.currentTarget; b.disabled = true; b.textContent = "Enviando…";
      const {error} = await Cuenta.sb.from("sabihondo_sugerencias").insert({pregunta:p.q, respuesta:texto.slice(0,120)});
      b.replaceWith(document.createTextNode(error ? " No se ha podido enviar." : " Gracias, la revisaremos."));
      campo.focus();
    });
    const tj = $("#tarjeta"); tj.classList.remove("sacudir"); void tj.offsetWidth; tj.classList.add("sacudir");
    campo.select();
  }

  $("#f").addEventListener("submit", async e => {
    e.preventDefault();
    const texto = campo.value.trim();
    if (!texto || consultando || terminada) return;
    const r = evalua(p, texto);
    if (r) return acaba({nv:r.nv, disp:r.disp, tuya:texto});
    // no está en el banco: lo decide el juez (IA), si responde a tiempo
    consultando = true;
    $("#aviso").textContent = "Comprobando «" + texto + "»…";
    const v = await juzga(p.q, texto);
    consultando = false;
    if (terminada) return;
    if (v && v.valida){
      const nv = Math.min(4, Math.max(0, (v.nivel|0) - 1));
      p.t[nv].push([v.nombre, [compacta(v.nombre), compacta(texto)]]);   // para el resto de la sesión
      return acaba({nv, disp:v.nombre, tuya:texto, ia:true});
    }
    rechaza(texto);
  });

  (function reloj(){
    const resta = Math.max(0, MS_RESP - (performance.now() - t0));
    relleno.style.transform = "scaleX(" + (resta/MS_RESP) + ")";
    seg.textContent = Math.ceil(resta/1000);
    if (resta < 5000){
      barra.classList.add("urge");
      const s = Math.ceil(resta/1000);
      if (s !== ultimoTic && s > 0){ ultimoTic = s; Son.tic(); }
    }
    if (resta <= 0) return acaba(null);
    temporizador = requestAnimationFrame(reloj);
  })();
}

function cierra(r){
  paraReloj();
  const p = J.rondas[J.i];
  const N = nivel(r), pts = N ? N.pts : 0;
  J.puntos += pts;
  J.res.push(r ? {...r, q:p.q, joyas:joyasDe(p)} : {nv:null, q:p.q, tuya:null, joyas:joyasDe(p)});
  profMeta = J.puntos; fijaPines(J.res);

  if (r){ Son.baja(r.nv); if (N === NIVELES[4]) setTimeout(()=>Son.capa(), 350); } else Son.fallo();

  escena.innerHTML = `
  <div class="panel">
    ${cabecera()}
    ${N ? `<div class="nivel" style="--nc:${N.col};--nt:${N.txt}">
             <span class="nivel-n">Nivel ${numNivel(r)}</span><span class="nivel-t">${esc(N.n)}</span>
           </div>`
        : `<div class="nivel" style="--nc:#1b2e44;--nt:#ffffff"><span class="nivel-t">Sin respuesta</span></div>`}
    ${escalera(r)}
    <p class="tuya ${r?"":"nada"}">${r ? esc(r.disp) : "Se acabó el tiempo"}</p>
    <p class="expl">${N ? esc(N.d) : "Le pasa a todo el mundo alguna vez."}</p>
    ${r && r.ia ? `<p class="coña">No estaba en nuestra lista: la ha dado por buena el juez.</p>` : ``}
    <div class="baja">
      <b>+${pts} m</b>
      <span>Llevas <strong>${mil(J.puntos)} m</strong> de ${FONDO}</span>
    </div>
    <div class="botonera">
      <button class="btn" id="bSig">${J.i+1 < RONDAS ? "Siguiente pregunta" : "Ver mi iceberg"}</button>
    </div>
  </div>`;
  $("#bSig").focus({preventScroll:true});
  $("#bSig").addEventListener("click", () => { J.i++; if (J.i < RONDAS) ronda(); else final(); });
}

// los cinco niveles en fila, con el tuyo encendido
function escalera(r){
  const k = r ? idxNivel(r) : -1;
  return `<ol class="escalera" aria-label="Nivel ${k+1} de 5">
    ${NIVELES.map((N,i)=>`<li class="${i===k?"on":""}" style="--nc:${N.col}"><span>${i+1}</span></li>`).join("")}
  </ol>`;
}

function final(){
  paraReloj();
  const metros = J.puntos;
  profMeta = metros; fijaPines(J.res);
  if (!J.revisita) Son.fondo();

  pantalla = "final";
  let est = guarda.get("est", {jugadas:0, racha:0, mejorRacha:0, mejor:0, ultima:null});

    const ayer = new Date(Date.UTC(Y, M-1, D) - 864e5).toISOString().slice(0,10);
    est.racha = est.ultima === ayer ? est.racha + 1 : 1;
    est.mejorRacha = Math.max(est.mejorRacha, est.racha);

      <div>Mejor racha<b>${est.mejorRacha}</b></div>
      <div>Partidas<b>${est.jugadas}</b></div>
      <div>Récord<b>${mil(est.mejor)} m</b></div>
    </div>
    ${Cuenta.sb && !Cuenta.user && J.modo === "diaria" ? `<p class="apunte aviso-cuenta">Esta racha solo está guardada en este navegador.

    <div class="botonera">

  $("#bGuardar")?.addEventListener("click", ()=>abreCuenta(true, "alta"));

/* todas las respuestas válidas de una pregunta, agrupadas por nivel.
   Las listas pueden tener miles: se enseñan las más conocidas y el total. */
const MAX_VER = 60;
async function todasLas(r){
  const i = PREGUNTAS.findIndex(x => x.q === r.q);
  if (i < 0) return `<p class="mini">Esta pregunta ya no está en el banco.</p>`;
  const p = await cargaPregunta(i);
  const tuya = nivel(r) ? compacta(r.disp) : null;
  return NIVELES.map((N,k) => {
    const todas = p.t[k].map(x => x[0]);
    if (!todas.length) return "";
    let lista = todas.slice(0, MAX_VER);
    const mia = tuya && todas.find(x => compacta(x) === tuya);
    if (mia && !lista.includes(mia)) lista.push(mia);
    lista = lista.sort((x,y) => x.localeCompare(y,"es"));
    const resto = todas.length - lista.length;
    return `<div class="grupo">
      <div class="grupo-cab"><span class="tag" style="--nc:${N.col};--nt:${N.txt};margin:0">Nivel ${k+1} · ${esc(N.n)}</span>
        <span class="pt">+${N.pts} m · ${mil(todas.length)}</span></div>
      <p class="resps">${lista.map(x => compacta(x) === tuya
          ? `<mark style="--nc:${N.col}">${esc(x)}</mark>` : esc(x)).join(" · ")}${resto > 0 ? ` <span class="mas">y ${mil(resto)} más</span>` : ""}</p>
    </div>`;
  }).join("");
}

/* ═════════ el juez: respuestas que no están en el banco ═════════ */
async function juzga(pregunta, respuesta){
  const ctrl = new AbortController(), plazo = setTimeout(() => ctrl.abort(), 8000);
  try{
    const r = await fetch(SB_URL + "/functions/v1/sabihondo-juez", {
      method:"POST", signal:ctrl.signal,
      headers:{"Content-Type":"application/json", apikey:SB_KEY, Authorization:"Bearer " + SB_KEY},
      body:JSON.stringify({pregunta, respuesta})
    });
    return r.ok ? await r.json() : null;
  }catch{ return null; }
  finally{ clearTimeout(plazo); }
}

function iniciaCuenta(){

async function cargaPartidas(){
  const sb = Cuenta.sb, uid = Cuenta.user?.id; if (!uid) return;
  await subeLocales(uid);
  const {data, error} = await sb.from(TABLA).select("fecha,dia,puntos,res").order("fecha", {ascending:false});
  if (Cuenta.user?.id !== uid) return;
  Cuenta.partidas = error ? [] : data;
  if (error) console.warn("Sabihondo: no se pudieron leer las partidas", error);
  pintaBotonCuenta();
  if (pantalla === "portada") portada();
  if (!$("#cuenta").hidden) abreCuenta(true);

// las partidas jugadas en este navegador antes de entrar se suben a la cuenta
async function subeLocales(uid){
  const filas = {};
  try{
    for (let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i), m = k && k.match(/^(?:sabihondo|krillon):hecho:(\d{4}-\d{2}-\d{2})$/);
      if (!m) continue;
      const h = JSON.parse(localStorage.getItem(k));
      if (h && typeof h.puntos === "number") filas[m[1]] = {user_id:uid, fecha:m[1], dia:h.dia ?? numeroDia(m[1]), puntos:h.puntos, res:h.res || []};
    }
  }catch{}
  const lista = Object.values(filas);
  if (!lista.length) return;
  const {error} = await Cuenta.sb.from(TABLA).upsert(lista, {onConflict:"user_id,fecha", ignoreDuplicates:true});
  if (error) console.warn("Sabihondo: no se pudieron subir las partidas locales", error);
}

async function guardaEnNube(p){
  if (!Cuenta.user) return;
  if (Cuenta.partidas && !Cuenta.partidas.some(x => x.fecha === p.fecha)) Cuenta.partidas.unshift(p);
  const {error} = await Cuenta.sb.from(TABLA).upsert([{user_id:Cuenta.user.id, ...p}], {onConflict:"user_id,fecha", ignoreDuplicates:true});
  if (error) console.warn("Sabihondo: no se pudo guardar la partida", error);
}

const logueado = () => !!(Cuenta.user && Cuenta.partidas);
function hechoHoy(){
  const hoy = hoyMadrid();
  if (logueado()) return Cuenta.partidas.find(p => p.fecha === hoy) || guarda.get("hecho:" + hoy, null);
  return guarda.get("hecho:" + hoy, null);
}
function stats(){
  if (!logueado()) return guarda.get("est", {jugadas:0, racha:0, mejorRacha:0, mejor:0, ultima:null});
  const n = f => { const [y,m,d] = f.split("-").map(Number); return Date.UTC(y,m-1,d)/864e5; };
  const dias = [...new Set(Cuenta.partidas.map(p => n(p.fecha)))].sort((a,b)=>a-b);
  let mejorRacha = 0, tramo = 0;
  dias.forEach((d,i) => { tramo = i && d === dias[i-1]+1 ? tramo+1 : 1; mejorRacha = Math.max(mejorRacha, tramo); });
  const hoy = n(hoyMadrid()), ultimo = dias[dias.length-1];
  const racha = dias.length && ultimo >= hoy-1 ? tramo : 0;
  return {jugadas:dias.length, racha, mejorRacha, mejor:Math.max(0, ...Cuenta.partidas.map(p => p.puntos))};
}

function pintaBotonCuenta(){
  const b = $("#bCuenta");

    b.classList.add("dentro"); b.title = "Tu cuenta";

}

const errorEs = e => {
  const m = (e && e.message || "").toLowerCase();
  if (m.includes("invalid login")) return "El email o la contraseña no coinciden.";
  if (m.includes("already registered") || m.includes("already been registered")) return "Ya hay una cuenta con ese email. Entra con tu contraseña.";
  if (m.includes("password") && m.includes("6")) return "La contraseña necesita al menos 6 caracteres.";
  if (m.includes("email") && m.includes("invalid")) return "Ese email no parece válido.";
  if (m.includes("not confirmed")) return "Tienes que confirmar el email antes de entrar. Revisa tu correo.";
  if (m.includes("rate") || m.includes("too many")) return "Demasiados intentos seguidos. Espera un minuto.";
  return "No se ha podido: " + (e && e.message || "error desconocido");
};

      boton.disabled = false;
      if (error){ aviso.textContent = errorEs(error); return; }
      if (alta && !data.session){ aviso.textContent = "Cuenta creada. Te hemos mandado un correo para confirmarla; ábrelo y luego entra aquí."; return; }
      aviso.textContent = "";
    });
    $("#cEmail").focus();
  }
  $("#bCerrarC").addEventListener("click", () => abreCuenta(false));
}
$("#bCuenta").addEventListener("click", () => abreCuenta($("#cuenta").hidden));

/* ═════════ ayuda ═════════ */
function ayuda(abrir){
  const caja = $("#ayuda");
  if (!abrir){ caja.hidden = true; caja.innerHTML = ""; return; }
  caja.hidden = false;
  caja.innerHTML = `
  <div class="panel">
    <h2>Cómo se juega</h2>
    <p class="mini">Te salen siete enunciados abiertos y escribes <b>una</b> respuesta a cada uno antes de que se acabe el tiempo. Todas las respuestas correctas cuentan. Lo que cambia es cuánta gente diría la tuya: cuanto menos, más metros bajas por el iceberg.</p>
    <h3>Los cinco niveles</h3>
    <ul class="escala">
      ${NIVELES.map((N,i)=>`<li><span class="tag" style="--nc:${N.col};--nt:${N.txt};margin:0">Nivel ${i+1}</span>
        <span><span class="n">${N.n}</span><span class="d">${esc(N.d)}</span></span>
        <span class="p">+${N.pts} m</span></li>`).join("")}
    </ul>
    <p class="mini">De un iceberg solo asoma el 10 %. Aquí pasa igual: siete respuestas de superficie suman 70 m y te dejan justo en la línea de flotación.</p>
    <h3>De dónde salen las respuestas</h3>
    <p class="mini">Cuando hay una lista oficial, sale de ahí: el INE para provincias y comunidades, la ONU para países y capitales, la UNESCO para el Patrimonio Mundial o la Unión Astronómica Internacional para las constelaciones.</p>
    <h3>Erratas</h3>
    <p class="mini">Se perdonan. «Cadiz» o «Pikachú» entran igual, porque se compara sin tildes y con margen de un par de letras.</p>
    <h3>Lo que no está</h3>
    <p class="mini">La lista tiene <b>${PREGUNTAS.length} preguntas</b> y <b>${mil(PREGUNTAS.reduce((s,p)=>s+p.n,0))} respuestas</b>. Si escribes algo correcto que no aparece, el juego te deja probar otra mientras quede tiempo. No has fallado, es que falta en la lista.</p>
    <div class="botonera"><button class="btn" id="bCerrar">Volver</button></div>
  </div>`;
  caja.scrollTop = 0;
  $("#bCerrar").focus({preventScroll:true});
  $("#bCerrar").addEventListener("click", ()=>ayuda(false));
}
$("#bAyuda").addEventListener("click", ()=>ayuda($("#ayuda").hidden));
addEventListener("keydown", e => { if (e.key === "Escape"){ ayuda(false); abreCuenta(false); } });

const bs = $("#bSon");
bs.setAttribute("aria-pressed", String(Son.activo()));
bs.textContent = Son.activo() ? "♪" : "✕";
bs.addEventListener("click", ()=>{ const on = Son.alterna(); bs.setAttribute("aria-pressed", String(on)); bs.textContent = on ? "♪" : "✕"; });

/* ═════════ arranque ═════════ */
dibujaIceberg();
requestAnimationFrame(anima);
portada();
iniciaCuenta();
document.fonts?.ready.then(() => mueveMarca());
</script>
