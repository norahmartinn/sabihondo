<style>[hidden]{display:none!important}/* ── lo mejor de la semana: historias a pantalla completa al acabar la partida del domingo ── */
.pestanas{display:flex;gap:6px;margin:14px 0 16px;padding:4px;border-radius:14px;background:color-mix(in srgb,var(--tinta) 8%,transparent)}
.pestanas button{flex:1;font:inherit;font-weight:800;font-size:15px;padding:9px 8px;border:0;border-radius:10px;background:transparent;color:var(--tinta-suave);cursor:pointer}
.pestanas button[aria-selected="true"]{background:var(--tinta);color:#fbf7f2}
.top-velo{position:fixed;inset:0;z-index:60;background:rgba(9,24,45,.62);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));animation:top-entra .25s ease-out}
.top-carta{width:min(400px,100%);height:min(640px,100%);background:#12294b;color:#fbf7f2;border-radius:24px;padding:16px 18px 18px;
  display:flex;flex-direction:column;justify-content:space-between;gap:14px;text-align:center;box-shadow:0 24px 60px rgba(4,13,24,.5)}
.top-barras{display:flex;gap:4px}
.top-barras i{flex:1;height:4px;border-radius:2px;background:rgba(251,247,242,.25)}
.top-barras i.ya{background:#ee6fa3}
.top-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:#c9d3e2;text-align:left}
.top-cerrar{font:inherit;font-size:22px;line-height:1;background:none;border:0;color:#fbf7f2;cursor:pointer;padding:4px 8px;margin:-4px -8px -4px 0}
.top-centro{display:flex;flex-direction:column;gap:16px;align-items:center;min-height:0;overflow:auto}
.top-titulo{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(38px,10.5vw,50px);line-height:1.06;text-wrap:balance}
.top-dias{margin:-4px 0 0;font-size:18px;font-weight:800;color:#ee6fa3}
.top-preg{margin:0;font-size:16.5px;color:#c9d3e2}
.top-resp{margin:0;font-family:var(--disp);font-weight:400;font-style:italic;font-size:clamp(34px,9vw,44px);line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.top-resp.recta{font-style:normal}   /* un emoji no se inclina */
.top-resp.varias{font-size:clamp(25px,6.6vw,31px)}
.top-quien{margin:0;font-size:18px;font-weight:800;color:#ee6fa3}
.top-metros{list-style:none;margin:0;padding:0;width:100%;display:grid;gap:8px;text-align:left}
.top-metros li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:11px 14px;border-radius:14px;background:rgba(251,247,242,.08)}
.top-metros li.tu{background:rgba(238,111,163,.22)}
.top-metros span{font-family:var(--disp);font-size:22px;color:#ee6fa3}
.top-metros b{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-metros em{font-style:normal;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.top-pasos{display:flex;gap:10px}
.top-pasos button{flex:1;font:inherit;font-weight:800;font-size:16px;border-radius:14px;padding:13px 10px;cursor:pointer;
  border:1.5px solid rgba(251,247,242,.4);background:transparent;color:#fbf7f2}
.top-pasos button:disabled{opacity:.35;cursor:default}
.top-pasos .sig{background:#ee6fa3;border-color:#ee6fa3;color:#12294b}
.top-velo :focus-visible{outline-color:#ee6fa3}
@keyframes top-entra{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.top-velo{animation:none}}

// Si algo falla al arrancar, que se vea qué ha sido en vez de quedarse la pantalla en blanco.
window.addEventListener("error", function(e){
  if (document.getElementById("fallo-arranque") || !e || !e.message) return;
  var d = document.createElement("p"); d.id = "fallo-arranque";
  d.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:99;margin:0;padding:12px 14px;border-radius:12px;background:#12294b;color:#fff;font:14px/1.4 system-ui,sans-serif";
  d.textContent = "Algo ha fallado al cargar el juego. Recarga la página. (" + e.message + (e.lineno ? ", línea " + e.lineno : "") + ")";
  (document.body || document.documentElement).appendChild(d);
});
</script>

<style>
/* ══ Sabihondo · identidad ══════════════════════════════════════
   Una sola escena a sangre: cielo crema arriba, mar azul abajo y un
   iceberg tallado en facetas. La tarjeta flota encima, a la derecha. */
:root{
  color-scheme:light;
  --mar:#3f8fb8;          /* agua justo bajo la línea de flotación */
  --fondo:#0e2f52;        /* lo más hondo */
  --cielo:#f7efe9;
  --cielo-tinta:#12294b;   /* texto encima del cielo (barra, escala) */
  --hielo:#fbf7f2;        /* la tarjeta */
  --tinta:#12294b;
  --tinta-suave:#4d6080;
  --linea:#aab4c4;
  --boya:#ee6fa3;         /* acento */
  --boya-hondo:#cb3b78;   /* el acento como texto sobre la tarjeta */
  --boya-tinta:#12294b;   /* texto encima del acento */
  --boya-suave:#f7c4d8;   /* círculos de los iconos, botón de entrar */

  --r-btn:14px; --r-panel:24px;
  --col:minmax(320px,50%);
  --disp:"Young Serif",Georgia,"Times New Roman",serif;
  --serif:"Source Serif 4",Georgia,serif;
  --sans:"Sen",system-ui,-apple-system,"Segoe UI",sans-serif;
}
/* Halloween (26 oct–1 nov): noche morada, naranja calabaza; la tarjeta sigue crema. Se activa por fecha o con #halloween */
:root.halloween{
  --mar:#3a2f6b; --fondo:#0d0a1f; --cielo:#1a1438; --cielo-tinta:#fff1df;
  --hielo:#fff6ec; --tinta:#1b1235; --tinta-suave:#5d4f6e; --linea:#dcc8b6;
  --boya:#ff7a1a; --boya-hondo:#c9520a; --boya-tinta:#1b1235; --boya-suave:#ffd9b8;
}
.halloween #barra .icono{color:var(--cielo-tinta);border-color:var(--cielo-tinta)}
.halloween #barra .icono:hover{color:var(--tinta)}
.halloween #medTu{color:var(--tinta)}
.halloween h1,.halloween #marca{font-family:"Creepster","Young Serif",Georgia,serif;letter-spacing:.01em}
.halloween h1{line-height:1}
.halloween .placa-racha{background:#fbe8d6;border-color:#f2d2b4}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--fondo);color:var(--tinta);font-family:var(--sans);font-size:15px;
  line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--boya-hondo);outline-offset:3px;border-radius:6px}
::selection{background:var(--boya);color:var(--boya-tinta)}

#app{height:100%;height:100dvh;display:grid;grid-template-columns:var(--col) minmax(0,1fr);grid-template-rows:auto 1fr}

/* ── barra ───────────────────────────────────────────── */
#barra{grid-column:1 / -1;grid-row:1;position:relative;z-index:2;min-width:0;display:flex;align-items:center;gap:16px;
  padding:14px 28px;padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:color-mix(in srgb,var(--cielo) 72%,transparent);color:var(--cielo-tinta);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#marca{font-family:var(--disp);font-weight:400;font-size:31px;line-height:1;letter-spacing:-.03em}
#marca em{font-style:normal;color:var(--boya)}
#barra .sep{flex:1}
.icono{width:40px;height:40px;border:1.5px solid var(--tinta);border-radius:50%;color:var(--tinta);
  display:grid;place-items:center;font-size:15px;font-weight:800;transition:.15s}
.icono:hover{background:var(--boya-suave)}

#medidor{display:none}
/* ── el iceberg: ocupa toda la pantalla, por detrás ──── */
#hielo{grid-column:1 / -1;grid-row:1 / -1;position:relative;overflow:hidden;background:var(--fondo)}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#svg text{font-family:var(--sans)}

/* ── escena ──────────────────────────────────────────── */
#escena{grid-column:2;grid-row:2;position:relative;z-index:1;overflow-y:auto;overscroll-behavior:contain;
  padding:28px 40px 36px 16px;display:flex;flex-direction:column}
.icono-inicio{display:flex;flex-direction:column;align-items:center;gap:6px;margin:18px auto 6px;padding:18px 34px 14px;width:max-content;
  border-radius:22px;background:linear-gradient(160deg,#8aa0c2,#5b6f95)}
.icono-inicio img{width:76px;height:76px;border-radius:18px;box-shadow:0 6px 14px -6px rgba(8,28,56,.55)}
.icono-inicio span{color:#fff;font-size:14px;font-weight:600;letter-spacing:.01em;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.ojo-safari{margin:16px 0 4px;padding:12px 14px;border-radius:14px;background:#fde3ee;color:#8f1f4f;font-size:.98rem;line-height:1.4}
.pasos-inicio{margin:14px 0 4px;padding-left:1.3em;display:grid;gap:10px;line-height:1.45}
.ico-safari{width:1.25em;height:1.25em;vertical-align:-.25em;color:#2f7ff6}
.panel{width:100%;max-width:640px;margin:auto;background:var(--hielo);border-radius:var(--r-panel);padding:36px 42px 38px;
  box-shadow:0 30px 60px -28px rgba(8,28,56,.55),0 2px 6px rgba(8,28,56,.08)}
.sitio-berg{display:none}
.rotulo{font-family:var(--sans);font-size:13.5px;
  color:var(--tinta);margin:0 0 10px}
h1{font-family:var(--disp);font-weight:400;font-size:clamp(52px,7.4vw,104px);line-height:.92;margin:0;
  letter-spacing:-.035em;color:var(--tinta)}
h1 em{font-style:normal;color:var(--boya)}
.lema{font-family:var(--serif);font-size:19px;line-height:1.45;margin:20px 0 0;text-wrap:pretty}
.lema b{font-family:var(--sans);font-weight:800;color:var(--boya-hondo)}
.apunte{color:var(--tinta-suave);font-size:14px;margin:10px 0 0;max-width:56ch}
.apunte b{color:var(--tinta)}

.reglas{list-style:none;margin:26px 0 0;padding:24px 0 0;border-top:1px solid var(--linea);display:grid;gap:18px}
.reglas li{display:grid;grid-template-columns:52px 1fr;gap:20px;align-items:center;font-size:14.5px;line-height:1.4;
  color:var(--tinta-suave)}
.reglas b{display:block;color:var(--tinta);font-weight:800;font-size:17px}
.reglas .ico{width:52px;height:52px;border-radius:50%;background:var(--boya-suave);color:var(--tinta);
  display:grid;place-items:center}
.reglas .ico svg{width:30px;height:30px;display:block}

.botonera{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px;align-items:center}
.btn{font-family:var(--sans);font-weight:800;font-size:17px;line-height:1.2;
  padding:17px 30px;border-radius:var(--r-btn);background:var(--boya);color:var(--boya-tinta);border:1.5px solid var(--boya);
  display:inline-flex;align-items:center;gap:12px;transition:.15s;
  box-shadow:0 8px 18px -10px color-mix(in srgb,var(--boya-hondo) 80%,transparent)}
.btn:hover{background:color-mix(in srgb,var(--boya) 86%,var(--tinta));border-color:color-mix(in srgb,var(--boya) 86%,var(--tinta))}
.btn:active{transform:translateY(1px)}
.btn.oscuro{background:var(--tinta);border-color:var(--tinta);color:#fff;box-shadow:0 8px 18px -10px var(--tinta)}
.btn.oscuro:hover{background:color-mix(in srgb,var(--tinta) 85%,#fff);border-color:color-mix(in srgb,var(--tinta) 85%,#fff)}
.cima{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
.btn.fantasma{background:none;color:var(--tinta);border-color:var(--linea);box-shadow:none}
.btn.fantasma:hover{border-color:var(--tinta);background:#fff}
.racha{font-family:var(--sans);font-size:13.5px;color:var(--tinta-suave);}
/* racha: placa con la llama y el número, a la izquierda de los botones; la llama en gris hasta que se juega el día */
.placa-racha{display:flex;align-items:center;gap:10px;flex:none;padding:8px 12px 8px 8px;border-radius:16px;background:#f3ebe4;border:1.5px solid #e6d9ce}
.placa-racha .llama{width:34px;height:34px;flex:none}
.placa-racha .llama svg{width:100%;height:100%;display:block}
.placa-racha b{font-family:var(--disp);font-weight:400;font-size:27px;line-height:1;color:var(--tinta)}
.placa-racha .txt{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--tinta-suave);line-height:1.2}
.placa-racha:not(.on) .llama{filter:grayscale(1);opacity:.55}
.placa-racha.on .llama{animation:llamaSalta .6s cubic-bezier(.3,1.6,.5,1) both}
.placa-racha.on .vive{animation:llamaVive 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes llamaSalta{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes llamaVive{50%{transform:scale(1.06) rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){.placa-racha .llama,.placa-racha .vive{animation:none}}


/* ── tutorial ────────────────────────────────────────── */
/* mientras dura, solo se ve el recuadro: el iceberg se guarda para cuando empieza la partida */
#app.solo-tutorial #svg{visibility:hidden}
#app.solo-tutorial #hielo{background:linear-gradient(180deg,var(--cielo) 0 30%,var(--mar) 30%,var(--fondo) 100%)}
#app.solo-tutorial #escena{grid-column:1 / -1;padding-inline:20px}
#app.solo-tutorial .panel{max-width:720px;padding:40px 48px 42px}
.tuto-paso{font-size:14px;font-weight:700;color:var(--tinta-suave);margin:0 0 14px}
.tuto h2{font-size:clamp(28px,3.6vw,40px);margin:22px 0 0;text-wrap:balance}
.tuto .lema{margin-top:10px;font-size:18px}
/* los ejemplos son ilustraciones, no controles: marco discontinuo, fondo apagado y etiqueta «Ejemplo» */
.demo{position:relative;background:color-mix(in srgb,var(--tinta) 5%,var(--hielo));border:1.5px dashed var(--linea);border-radius:18px;
  padding:30px 22px 20px;margin-top:12px;display:grid;gap:12px;pointer-events:none;user-select:none;cursor:default}
.demo::before{content:"Ejemplo";position:absolute;top:-12px;left:18px;background:var(--tinta);color:#fff;
  font-size:12.5px;font-weight:700;line-height:1;padding:6px 12px;border-radius:999px}
.demo .enunciado{font-size:21px}
.demo-campo{display:flex;gap:8px;align-items:stretch}
.demo-campo span{flex:1;background:#fff;border:1.5px solid var(--linea);border-radius:10px;padding:8px 12px;font-size:15px}
.demo-campo span::after{content:"";display:inline-block;width:1.5px;height:1.1em;background:var(--tinta);vertical-align:-3px;margin-left:2px;
  animation:late 1s steps(2) infinite}
.demo-campo b{background:color-mix(in srgb,var(--boya) 55%,#fff);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:800;display:grid;place-items:center}
.demo .reloj{margin-top:0}
.demo .segundos{font-size:24px}
.demo-fila{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center}
.demo-fila + .demo-fila{border-top:1px solid var(--linea);padding-top:14px}
.demo-fila .r{font-family:var(--disp);font-size:21px;line-height:1.1}
.demo-fila .m{font-family:var(--disp);font-size:24px;color:var(--boya-hondo);font-variant-numeric:lining-nums;grid-row:span 2}
.demo-fila .tag{justify-self:start;margin:0}
.demo.mar{padding:24px 14px 14px}
.demo.mar svg{display:block;width:100%;height:auto;border-radius:10px}
.puntos{display:flex;gap:7px;align-items:center}
.puntos i{width:9px;height:9px;border-radius:50%;background:var(--linea);display:block}
.puntos i.on{width:26px;border-radius:999px;background:var(--boya)}
.tuto .botonera{justify-content:space-between}
.btn.grande{font-size:20px;padding:20px 34px;flex:1 1 auto;justify-content:center}
.tuto-fin{flex:1;display:grid;gap:10px;justify-items:center;text-align:center}
.tuto-fin .btn{width:100%}
.tuto-fin .mini{margin:0}
.tuto-fin .enlace{font-size:15px;color:var(--tinta-suave);margin-top:4px}

/* ── ronda ───────────────────────────────────────────── */
.cabecera{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-family:var(--sans);font-size:13.5px;
  color:var(--tinta-suave);border-bottom:1px solid var(--linea);padding-bottom:13px;margin-bottom:22px}
.cabecera .m{color:var(--boya-hondo);font-weight:500;font-variant-numeric:tabular-nums}
.enunciado{font-family:var(--disp);font-weight:400;font-size:clamp(28px,3.8vw,42px);line-height:1.08;
  margin:0;text-wrap:balance;letter-spacing:-.01em}

form{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}
input[type=text],input[type=email],input[type=password]{flex:1 1 180px;min-width:0;background:#fff;border:1.5px solid var(--linea);border-radius:var(--r-btn);
  color:var(--tinta);padding:15px 18px;font-family:var(--sans);font-size:17px}
input::placeholder{color:#8e9bb0}
input[type=text]:focus,input[type=email]:focus,input[type=password]:focus{outline:none;border-color:var(--boya);box-shadow:0 0 0 4px color-mix(in srgb,var(--boya) 24%,transparent)}
.reloj{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-top:20px}
.mecha{height:10px;background:color-mix(in srgb,var(--tinta) 10%,transparent);border-radius:999px;overflow:hidden}
.mecha i{display:block;height:100%;background:var(--boya);border-radius:999px;transform-origin:left;transition:transform .1s linear,background .3s}
.segundos{font-family:var(--disp);font-weight:400;font-size:30px;line-height:1;min-width:2.4ch;text-align:right;
  font-variant-numeric:lining-nums tabular-nums;color:var(--tinta)}
.segundos small{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--tinta-suave);margin-left:2px}
.reloj.urge .mecha i{background:#e5484d}
.reloj.urge .segundos{color:#e5484d;animation:late 1s steps(2) infinite}
@keyframes late{50%{opacity:.45}}
.aviso{margin:11px 0 0;font-size:14px;color:var(--boya-hondo);min-height:20px}
.sacudir{animation:sac .34s}
@keyframes sac{25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* ── veredicto ───────────────────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--sans);font-size:13px;font-weight:700;
  padding:5px 11px 5px 9px;border-radius:999px;background:#fff;
  border:1px solid var(--linea)}
.chip i{width:10px;height:10px;border-radius:50%;display:block}
.tuya{font-family:var(--disp);font-weight:400;font-size:clamp(32px,5vw,48px);line-height:1.05;margin:16px 0 0;
  letter-spacing:-.01em}
.tuya.nada{color:var(--tinta-suave)}
.coña{color:var(--tinta-suave);font-family:var(--serif);font-size:15px;font-style:italic;margin:8px 0 0;max-width:46ch;text-wrap:pretty}
.baja{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--linea)}
.baja b{font-family:var(--disp);font-weight:400;font-size:32px;color:var(--boya-hondo);font-variant-numeric:lining-nums tabular-nums}
.baja span{font-size:14.5px;color:var(--tinta-suave)}
.baja span strong{color:var(--tinta)}

.nivel{display:inline-flex;align-items:baseline;gap:10px;background:var(--nc);color:var(--nt);
  border-radius:999px;padding:7px 18px 7px 16px}
.nivel-n{font-family:var(--sans);font-size:13.5px;font-weight:700;opacity:.85}
.nivel-t{font-family:var(--sans);font-weight:800;font-size:18px}
.escalera{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:260px}
.escalera li{height:22px;border-radius:6px;background:var(--nc);opacity:.22;display:grid;place-items:center;
  font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--tinta)}
.escalera li.on{opacity:1;color:#fff;box-shadow:0 0 0 2px var(--hielo),0 0 0 4px var(--nc)}
.escalera li:first-child.on{color:var(--tinta)}
.expl{font-family:var(--serif);font-size:17px;margin:8px 0 0;max-width:46ch;text-wrap:pretty;color:var(--tinta)}
.tag{display:inline-block;margin-top:4px;font-family:var(--sans);font-size:12.5px;font-weight:700;
  background:var(--nc);color:var(--nt);border-radius:999px;padding:2px 9px;white-space:nowrap}

/* ── cuenta ──────────────────────────────────────────── */
.cuenta-btn{height:40px;min-width:40px;padding:0 24px;border-radius:999px;background:var(--boya-suave);color:var(--tinta);
  font-family:var(--disp);font-weight:400;font-size:17px;transition:.15s}
.cuenta-btn:hover{background:var(--boya)}
.cuenta-btn.dentro{padding:0;width:40px;background:var(--boya)}
.pestanas{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#fff;border:1px solid var(--linea);
  border-radius:var(--r-btn);padding:4px;margin-top:18px}
.pestanas button{border-radius:10px;padding:9px 10px;font-weight:700;font-size:14.5px;color:var(--tinta-suave)}
.pestanas button[aria-selected="true"]{background:var(--tinta);color:#fff}
.form-cuenta{display:grid;gap:6px;margin-top:16px}
.form-cuenta label{font-family:var(--sans);font-size:13px;color:var(--tinta-suave);margin-top:6px}
.form-cuenta .btn{margin-top:12px;justify-self:start}
.fila-apodo{display:flex;gap:8px;flex-wrap:wrap}
.fila-apodo .btn{margin-top:0;padding:13px 20px;font-size:15.5px}
.form-cuenta .btn:disabled{opacity:.5;cursor:wait}
.aviso-cuenta{margin-top:18px;padding:13px 16px;background:#fff;border:1px solid var(--linea);border-radius:12px;max-width:none}
.enlace{color:var(--boya-hondo);font-weight:700;text-decoration:underline;text-underline-offset:2px;padding:0}
.historial{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--linea)}
.historial li{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--linea)}
.h-dia{font-family:var(--sans);font-weight:800;font-size:15px;line-height:1.1}
.h-dia small{display:block;font-family:var(--sans);font-weight:400;font-size:12.5px;color:var(--tinta-suave)}
.h-nv{display:flex;gap:3px;flex-wrap:wrap}
.h-nv i{width:14px;height:14px;border-radius:4px;display:block}
.h-m{font-family:var(--sans);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

/* ── ranking ─────────────────────────────────────────── */
.ver-top{width:100%;margin:0 0 12px}
.cab-podio{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 6px}
.cab-podio h2{margin:0}
.directo{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font:inherit;font-size:13px;font-weight:800;line-height:1;text-transform:uppercase;
  padding:6px 0;border:0;background:none;color:var(--tinta);cursor:pointer}
.directo i{width:8px;height:8px;border-radius:50%;background:#e5484d;animation:directo 1.4s ease-in-out infinite}
@keyframes directo{50%{opacity:.25}}
.ranking{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--linea)}
.ranking li{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:baseline;padding:11px 10px;border-bottom:1px solid var(--linea)}
.ranking .puesto{font-family:var(--disp);font-size:20px;font-variant-numeric:lining-nums tabular-nums;color:var(--tinta-suave)}
.ranking .quien{font-weight:800;font-size:16.5px;overflow-wrap:anywhere}
.ranking .metros{font-weight:700;font-variant-numeric:tabular-nums}
.ranking li.tu{background:var(--boya-suave);border-radius:10px;border-bottom-color:transparent}
.ranking li.tu .puesto{color:var(--tinta)}
.ranking li:first-child .puesto{color:var(--boya-hondo)}

/* ── resultado ───────────────────────────────────────── */
.hondura{font-family:var(--disp);font-weight:400;font-size:clamp(64px,11vw,108px);line-height:1;margin:6px 0 0;
  font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.02em}
.hondura small{font-family:var(--sans);font-size:.26em;color:var(--tinta-suave);font-weight:700;margin-left:8px;letter-spacing:0}
.capa-final{font-family:var(--sans);font-weight:800;font-size:19px;margin:10px 0 0;color:var(--boya-hondo)}
.tira{list-style:none;margin:20px 0 0;padding:0;border-top:1px solid var(--linea)}
.tira li{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:baseline;padding:11px 2px;
  border-bottom:1px solid var(--linea);font-size:14.5px}
.tira .pt-c{width:10px;height:10px;border-radius:50%;align-self:center}
.tira .pr{color:var(--tinta-suave);font-size:12.5px;display:block;line-height:1.3;margin-bottom:1px}
.tira .ver{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;text-align:left;padding:0;cursor:pointer}
.tira .ver:hover{color:var(--tinta)}
.tira .flecha{font-family:var(--sans);font-size:12.5px;color:var(--boya-hondo);
  border-bottom:1px dotted currentColor}
.tira .ver[aria-expanded="true"] .flecha{color:var(--tinta-suave)}
.tira .ver[aria-expanded="true"] .flecha::after{content:" ↑"}
.tira .ver[aria-expanded="false"] .flecha::after{content:" ↓"}
.todas[hidden]{display:none}
.todas{grid-column:1 / -1;display:grid;gap:10px;background:#fff;border:1px solid var(--linea);border-radius:12px;
  padding:13px 16px;margin:4px 0 2px}
.grupo-cab{display:flex;justify-content:space-between;align-items:center;gap:10px}
.resps{margin:6px 0 0;font-size:13.5px;line-height:1.6;color:var(--tinta)}
.resps .mas{color:var(--tinta-suave);font-style:italic}
.resps mark{background:none;color:var(--tinta);font-weight:700;box-shadow:inset 0 -3px 0 var(--nc);padding:0 1px}
.tira .rs{font-weight:700}
.tira .rs.falla{color:var(--tinta-suave);font-weight:400;font-style:italic}
.tira .joya{color:var(--boya-hondo);font-size:12.5px;display:block;margin-top:2px}
.tira .pt{font-family:var(--sans);color:var(--tinta-suave);font-variant-numeric:tabular-nums;font-size:12px}
.marcador{display:flex;gap:26px;flex-wrap:wrap;margin-top:22px}
.marcador div{font-family:var(--sans);font-size:12.5px;color:var(--tinta-suave);}
.marcador b{display:block;font-family:var(--disp);font-size:30px;line-height:1.15;color:var(--tinta);letter-spacing:0;
  text-transform:none;font-variant-numeric:lining-nums tabular-nums;margin-top:2px;font-weight:400}
.copiado{color:var(--boya-hondo);font-size:13px;font-family:var(--sans)}
a.btn{text-decoration:none}

/* ── ayuda ───────────────────────────────────────────── */
#ayuda[hidden],#cuenta[hidden]{display:none}
#ayuda,#cuenta{position:fixed;inset:0;z-index:8;background:rgba(10,32,60,.62);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;flex-direction:column;padding:20px 16px;overflow-y:auto}
h2{font-family:var(--disp);font-weight:400;font-size:34px;line-height:1.05;margin:0 0 6px;letter-spacing:-.01em}
h3{font-family:var(--sans);font-size:13.5px;color:var(--boya-hondo);
  margin:26px 0 8px;font-weight:500}
.mini{color:var(--tinta-suave);font-size:14.5px;margin:8px 0 0;max-width:60ch}
.mini b{color:var(--tinta)}
.escala{list-style:none;margin:10px 0 0;padding:0;border:1px solid var(--linea);border-radius:14px;overflow:hidden}
.escala li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;
  font-size:14.5px;background:#fff}
.escala li+li{border-top:1px solid var(--linea)}
.escala .pt-c{width:12px;height:12px;border-radius:50%}
.escala .n{font-weight:800}
.escala .d{color:var(--tinta-suave);font-size:13px;display:block}
.escala .p{font-family:var(--sans);font-size:12px;color:var(--tinta-suave);font-variant-numeric:tabular-nums}

@media (max-width:1000px){
  :root{--col:minmax(260px,40%)}
  #escena{padding-right:22px}
  .panel{padding:30px 30px 32px}
}
/* ── móvil: el iceberg se queda en una tira a la izquierda y la tarjeta ocupa el resto ── */
@media (max-width:720px){
  :root{--col:0px;--r-panel:20px}
  #barra{padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));gap:8px;flex-wrap:wrap}
  #marca{font-size:22px}
  .icono{width:38px;height:38px}
  .cuenta-btn{height:38px;min-width:38px;padding:0 14px;font-size:15px}
  .cuenta-btn.dentro{width:38px}
  /* sin sitio para el iceberg al lado: de fondo queda solo el cielo y el mar */
  #app{background:linear-gradient(180deg,var(--cielo) 0 22%,var(--mar) 22%,var(--fondo) 100%)}
  #app > #hielo{background:none}
  #app.solo-tutorial #hielo{background:none}
  #app > #hielo #svg{visibility:hidden}
  #escena{grid-column:1 / -1}
  /* el iceberg, dentro de la tarjeta del inicio y del resultado */
  .sitio-berg{display:block;height:230px;margin:-22px -18px 18px;border-radius:20px 20px 0 0;overflow:hidden}
  .sitio-berg.alto{height:440px}
  .sitio-berg #hielo{height:100%}
  /* la barra de metros, solo mientras se juega */
  #app.jugando #medidor{display:flex;flex:1 0 100%;align-items:center;gap:10px;font-size:12.5px;font-weight:700;padding:2px 2px 4px}
  #medTu{background:var(--boya-suave);border-radius:999px;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .pista{position:relative;flex:1;height:8px;border-radius:999px;background:linear-gradient(90deg,#cfe6f4,var(--mar) 35%,var(--fondo))}
  #medYo{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--boya);border:2.5px solid #fff;
    box-shadow:0 1px 4px rgba(8,28,56,.4);transition:left .5s ease}
  #medRec{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;background:#ffcf5c;border:1.5px solid var(--tinta);transform:rotate(45deg)}
  /* la tarjeta va arriba, no centrada: con el teclado abierto el campo sigue a la vista */
  #escena{padding:10px 12px calc(20px + env(safe-area-inset-bottom,0px))}
  .panel{padding:22px 18px 22px;margin:0 auto auto}
  h1{font-size:min(44px,11.5vw)}
  h2{font-size:28px}
  .lema{font-size:16.5px;margin-top:14px}
  .reglas{margin-top:18px;padding-top:16px;gap:12px}
  .reglas li{grid-template-columns:40px 1fr;gap:12px;font-size:13.5px}
  .reglas .ico{width:40px;height:40px}
  .reglas .ico svg{width:23px;height:23px}
  .reglas b{font-size:15.5px}
  .botonera{margin-top:20px;gap:10px}
  .btn{padding:14px 18px;font-size:16px;flex:1 1 auto;justify-content:center}
  .btn.grande{font-size:17px;padding:18px 16px;gap:8px}
  .racha{flex-basis:100%;text-align:center}
  .cabecera{margin-bottom:16px}
  .enunciado{font-size:26px}
  form{margin-top:18px}
  input[type=text],input[type=email],input[type=password]{flex-basis:100%;padding:14px 16px}
  .tuya{font-size:30px}
  .hondura{font-size:64px}
  .cima .btn{flex:0 0 auto}
  .marcador{gap:14px 22px}
  .marcador b{font-size:26px}
  .tira li{gap:10px}
  .demo{padding:26px 16px 16px}
  .demo .enunciado,.demo-fila .r,.demo-fila .m{font-size:20px}
  .fila-apodo .btn{flex:0 0 auto}
  #app.solo-tutorial #escena{padding-inline:12px}
  #app.solo-tutorial .panel{padding:24px 18px 24px;margin:auto}
  .tuto h2{font-size:26px}
  .tuto .lema{font-size:16.5px}
  #ayuda,#cuenta{padding:12px 10px calc(12px + env(safe-area-inset-bottom,0px));padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .escala li{grid-template-columns:auto 1fr;gap:6px 10px}
  .escala .p{grid-column:2}
  .ranking li{grid-template-columns:34px 1fr auto;padding-inline:8px}
}
@media (max-width:350px){
  #marca{font-size:20px}
  .icono{width:34px;height:34px}
  .cuenta-btn{height:34px;padding:0 10px}
  .panel{padding:20px 14px}
}
/* móvil tumbado: poca altura, así que todo más compacto */
@media (max-height:480px) and (min-width:721px){
  #barra{padding-block:6px}
  .icono,.cuenta-btn{height:34px}
  .icono{width:34px}
  #escena{padding-block:10px 14px}
  .panel{padding:20px 26px}
  h1{font-size:44px}
  .reglas{display:none}
  .enunciado{font-size:26px}
  .hondura{font-size:56px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

function pintaPines(){
  const g = $("#pines"); if (!g || !G) return;
  g.innerHTML = "";
  const {y,x,estrecho} = G;
  const conTexto = !estrecho && (G.H >= 440 || G.dentro);      // en pantallas muy bajas los nombres se pisan: solo puntos
  const hueco = conTexto ? 19 : 11;
  // Con respuestas de puntuación parecida los pines caerían uno encima de otro. Cada lado lleva su
  // cuenta: el punto y su nombre bajan lo justo para no pisar al anterior, y una raya los une
  // con la profundidad real en el eje del iceberg.
  const ultimo = [-99, -99];
  const yRec = conTexto && $("#record")?.firstChild && RECORD ? y(Math.min(FONDO, RECORD.puntos)) : null;
  pines.forEach((p,i) => {
    const lado = G.dentro ? 0 : i % 2, yy = y(p.m);   // en móvil todos a la derecha: a la izquierda están la escala y la marca
    const cx = x(lado ? .38 : .62);
    let yd = Math.max(yy, ultimo[lado] + hueco);
    if (!lado && yRec !== null && yd > yRec - 36 && yd < yRec + 10) yd = yRec + 12;   // la etiqueta del récord va por la derecha
    ultimo[lado] = yd;
    const N = nivel(p);
    el("polyline",{points:`${x(.5)},${yy} ${(x(.5)+cx)/2},${yd} ${cx},${yd}`,fill:"none",stroke:"#ffffff","stroke-width":1,opacity:.55},g);
    el("circle",{cx:x(.5),cy:yy,r:2,fill:"#ffffff",opacity:.8},g);
    el("circle",{cx,cy:yd,r:estrecho?4:5,fill:N?N.col:"#1b2e44",stroke:"#ffffff","stroke-width":1.5},g);
    if (!conTexto) return;
    const texto = N ? p.disp : "sin respuesta";
    const t = el("text",{x:cx + (lado ? -10 : 10),y:yd+4,"text-anchor":lado?"end":"start",
      fill:"#0a1f35","font-size":12,"font-weight":700,"paint-order":"stroke",stroke:"#ffffff","stroke-width":3,
      "stroke-linejoin":"round"},g);
    t.textContent = texto.length > 26 ? texto.slice(0,25)+"…" : texto;
    // si no cabe por su lado, se pasa al otro lado del punto
    const largo = t.getComputedTextLength();
    if (lado && cx - 10 - largo < 6){ t.setAttribute("text-anchor","start"); t.setAttribute("x", cx + 10); }
    else if (!lado && cx + 10 + largo > G.Z - 6){ t.setAttribute("text-anchor","end"); t.setAttribute("x", cx - 10); }
  });
}

function mueveMarca(){
  if (!G) return;
  const mk = $("#marca-tu"); if (!mk) return;

}

/* ═════════ sonido ═════════ */
const Son = (()=>{
  let ac=null, on = guarda.get("son", true);
  const arranca = () => { if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch{}} ac&&ac.state==="suspended"&&ac.resume(); };
  function tono(f,dur,vol,tipo="sine",desliz){
    if(!on||!ac) return;
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
    o.type=tipo; o.frequency.setValueAtTime(f,t);
    if(desliz) o.frequency.exponentialRampToValueAtTime(desliz,t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+.03);
  }
  return {
    arranca, activo:()=>on,
    alterna(){ on=!on; guarda.set("son",on); if(on){arranca();tono(520,.1,.05)} return on; },
    baja(t){ tono(880-t*60,.9,.05,"sine",300-t*30) },
    capa(){ tono(1320,.35,.04,"triangle",990) },
    fallo(){ tono(150,.22,.05,"square",90) },
    tic(){ tono(1300,.045,.028,"triangle") },
    fondo(){ tono(110,2,.08,"sine",55) }
  };
})();

/* ═════════ estado ═════════ */
let J = null;

/* cada pregunta vive en su propio archivo (banco/NN.json): solo se bajan las del día */
const CACHE_PREG = new Map();
/* Lo que el juez (IA) ya dio por bueno en esta pregunta entra en la lista como una respuesta más.
   Si no contesta en 3 s, se juega con el banco tal cual. */
const JUEZ_CRITERIO = "v4";   // el mismo CRITERIO que la función del juez
// v4 es más generoso que v3: lo que v3 aprobó sigue valiendo, así que se cargan los dos
const JUEZ_VALEN = ["v3", JUEZ_CRITERIO];
async function sumaJuez(p){
  const ctrl = new AbortController(), plazo = setTimeout(() => ctrl.abort(), 3000);
  try{
    const r = await fetch(SB_URL + "/rest/v1/sabihondo_ia?select=nombre,clave,nivel&valida=is.true&or=(" + JUEZ_VALEN.map(c => "modelo.like.*%23" + c).join(",") + ")&pregunta=eq." + encodeURIComponent(p.q),
      {headers:{apikey:SB_KEY, Authorization:"Bearer " + SB_KEY}, signal:ctrl.signal});
    if (!r.ok) return p;
    const ya = new Set(p.t.flatMap(n => n.flatMap(x => x[1])));
    for (const f of await r.json()){
      const k = compacta(f.nombre);
      if (ya.has(f.clave)) continue;
      // el juez a veces la reconoce como otra forma de decir una de la lista: va con esa, no como nueva
      const igual = ya.has(k) && entrada(p, k);
      if (igual){ igual.x[1].push(f.clave); ya.add(f.clave); continue; }
      if (ya.has(k)) continue;
      p.t[Math.min(4, Math.max(1, f.nivel - 1))].push([f.nombre, [k, f.clave]]); ya.add(k); ya.add(f.clave);
    }
  }catch{}
  finally{ clearTimeout(plazo); }
  return p;
}
function cargaPregunta(i){
  if (!CACHE_PREG.has(i)) CACHE_PREG.set(i, fetch("banco/" + String(i).padStart(2,"0") + ".json", {cache:"no-cache"})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    // una respuesta sin alias viene como texto suelto: su clave es la del propio texto
    .then(p => { p.t = p.t.map(nv => nv.map(x => typeof x === "string" ? [x, [compacta(x)]] : x)); return p; })
    .then(sumaJuez)
    .catch(e => { CACHE_PREG.delete(i); throw e; }));
  return CACHE_PREG.get(i);
}
async function empieza(modo, boton){
  Son.arranca();
  const texto = boton?.textContent;
  if (boton){ boton.disabled = true; boton.textContent = "Cargando…"; }
  try{ J = await nuevaPartida(modo); ronda(); }
  catch{
    if (boton){ boton.disabled = false; boton.textContent = texto; }
    alertaCarga();
  }
}
function alertaCarga(){
  const a = document.createElement("p"); a.className = "aviso"; a.textContent = "No se han podido cargar las preguntas. Revisa la conexión y vuelve a probar.";
  escena.querySelector(".panel")?.appendChild(a);
}

async function nuevaPartida(modo){
  const fecha = hoyMadrid(), dia = numeroDia(fecha);
  const semilla = modo === "libre" ? (Date.now() & 0x7fffffff) : dia * 7919;
  // las siete del día vienen del calendario; si ese día no está programado, salen siete al azar del banco
  if (modo !== "libre" && !CALENDARIO[fecha]) await refrescaCalendario();
  const delDia = modo !== "libre" && CALENDARIO[fecha];
  const rondas = await Promise.all((delDia || eligeRondas(semilla)).map(cargaPregunta));
  // si el reto de hoy ya estaba empezado (se cerró la pestaña, se recargó…), se sigue donde iba, no se empieza otro
  const c = modo === "diaria" ? enCurso() : null;
  if (c) return { modo, fecha, dia, rondas, i:c.i, res:c.res, puntos:c.puntos, t0:c.t0, fase:c.fase, reanuda:true };
  return { modo, fecha, dia, rondas, i:0, res:[], puntos:0 };
}
/* Una página que lleva días abierta (la app de la pantalla de inicio en el iPhone se «despierta» sin recargar)
   o que salió de la caché trae un calendario viejo: sin el día de hoy salían siete preguntas al azar, de otros días.
   Aquí se lee el calendario de la versión publicada y se añade a esta página. */
async function refrescaCalendario(){
  try{
    const html = await (await fetch(new URL("./", location.href).pathname + "?c=" + Date.now(), {cache:"no-store"})).text();
    const pq = html.match(/const PREGUNTAS=(\[.*?\]);/s), cal = html.match(/const CALENDARIO=(\{.*?\});/s);
    if (!pq || !cal) return;
    JSON.parse(pq[1]).forEach((x, i) => { PREGUNTAS[i] = x; });
    Object.assign(CALENDARIO, JSON.parse(cal[1]));
  }catch(e){ console.warn("Sabihondo: no se pudo refrescar el calendario", e); }
}
// si la página sigue abierta de otro día, al volver a ella se recarga entera (preguntas, tema, todo)
const DIA_CARGA = hoyMadrid();
function siCambioDeDia(){
  if (document.visibilityState === "visible" && hoyMadrid() !== DIA_CARGA && pantalla !== "juego") location.reload();
}
document.addEventListener("visibilitychange", siCambioDeDia);
window.addEventListener("pageshow", siCambioDeDia);
window.addEventListener("focus", siCambioDeDia);

/* La partida del día se va apuntando en este navegador a cada paso, con la hora real a la que salió cada
   pregunta. Así no se puede parar el reloj saliendo del juego ni volver a empezar recargando la página. */
/* Si las preguntas de un día cambian cuando ya ha jugado gente, se sube aquí su ronda: lo jugado antes
   en este navegador deja de contar y se puede volver a jugar (las partidas de la nube se borran a mano). */
const REINICIOS = {"2026-10-19": 2};
const rondaDia = f => REINICIOS[f] || 1;
const primeraDe = f => CALENDARIO[f] && PREGUNTAS[CALENDARIO[f][0]] ? PREGUNTAS[CALENDARIO[f][0]].q : null;
// también vale lo jugado con las preguntas nuevas antes de que existiera la marca de ronda
const preguntasDe = f => (CALENDARIO[f] || []).map(i => PREGUNTAS[i] && PREGUNTAS[i].q);
const deOtroDia = (h, f) => Array.isArray(h.res) && h.res.length >= 4 && CALENDARIO[f] && h.res.filter(r => r && preguntasDe(f).includes(r.q)).length < 4;
const vigente = (h, f) => !!h && !deOtroDia(h, f) && ((h.v || 1) >= rondaDia(f) || (Array.isArray(h.res) && h.res[0] && h.res[0].q === primeraDe(f)));
function enCurso(){
  const c = guarda.get("curso", null);
  return c && c.fecha === hoyMadrid() && vigente(c, c.fecha) && Array.isArray(c.res) && !hechoHoy() ? c : null;
}
function apuntaCurso(fase){
  if (!J || J.modo !== "diaria" || J.revisita) return;
  J.fase = fase;
  guarda.set("curso", {fecha:J.fecha, i:J.i, res:J.res, puntos:J.puntos, fase, t0:J.t0 || null, v:rondaDia(J.fecha)});
}
function fijaPines(res){
  let acc = 0;
  pines = res.map(r => { acc += nivel(r) ? nivel(r).pts : 0; return {m:acc, nv:idxNivel(r), disp:r.disp}; });
  pintaPines();
}

let temporizador = null;
function paraReloj(){ if (temporizador){ cancelAnimationFrame(temporizador); temporizador = null; } }

function ronda(){
  pantalla = "juego"; soloTutorial(false);
  // partida nueva: el iceberg vuelve a la punta y sin las respuestas de la anterior
  if (J.i === 0){ profMeta = 0; fijaPines([]); pintaRecord(); }
  if (J.reanuda){
    // se vuelve a una partida empezada: el iceberg con lo que ya llevaba
    J.reanuda = false; profMeta = J.puntos; fijaPines(J.res); pintaRecord();
    if (J.fase === "veredicto" || J.res.length > J.i){        // la pregunta en la que se fue ya estaba respondida
      J.i = J.res.length; J.t0 = null;
      if (J.i >= RONDAS) return final();
    }
  } else J.t0 = null;
  responder();
}

function responder(){
  paraReloj();
  const p = J.rondas[J.i];
  rescataIceberg(); escena.innerHTML = `
  <div class="panel" id="tarjeta">
    ${cabecera()}
    <p class="enunciado">${esc(p.q)}</p>
    <form id="f" autocomplete="off">
      <input type="text" id="r" placeholder="tu respuesta" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
      <button class="btn" type="submit">Bajar</button>
    </form>
    <div class="reloj" id="reloj" role="timer" aria-label="Tiempo para responder">
      <div class="mecha"><i style="transform:scaleX(1)"></i></div>
      <span class="segundos"><span id="seg">${MS_RESP/1000}</span><small>s</small></span>
    </div>
    <p class="aviso" id="aviso"></p>
  </div>`;

  trasPintar();
  const campo = $("#r"); campo.focus();
  const barra = $("#reloj"), relleno = barra.querySelector(".mecha i"), seg = $("#seg");
  // el reloj va con la hora real, no con el tiempo que la pestaña lleva a la vista: si sales, sigue corriendo
  if (!J.t0) J.t0 = Date.now();
  const t0 = J.t0; let ultimoTic = 99;
  apuntaCurso("pregunta");

  let terminada = false, consultando = false;
  const acaba = r => { if (terminada) return; terminada = true; cierra(r); };

  function rechaza(texto){
    Son.fallo();
    // cada intento que no está en el banco se apunta (sin esperar ni avisar si falla): sirve para ampliar las listas
    Cuenta.sb?.from("sabihondo_fallos").insert({pregunta:p.q, respuesta:texto.slice(0,120), fecha:J.fecha}).then(() => {}, () => {});
    $("#aviso").innerHTML = "«" + esc(texto) + "» no está en la lista. Prueba con otra."
      + (Cuenta.sb ? ` <button type="button" class="enlace" id="bSug">¿Es correcta? Avísanos</button>` : "");
    $("#bSug")?.addEventListener("click", async e => {
      const b = e.currentTarget; b.disabled = true; b.textContent = "Enviando…";
      const {error} = await Cuenta.sb.from("sabihondo_sugerencias").insert({pregunta:p.q, respuesta:texto.slice(0,120)});
      b.replaceWith(document.createTextNode(error ? " No se ha podido enviar." : " Gracias, la revisaremos."));
      campo.focus();
    });
    const tj = $("#tarjeta"); tj.classList.remove("sacudir"); void tj.offsetWidth; tj.classList.add("sacudir");
    campo.select();
  }

  $("#f").addEventListener("submit", async e => {
    e.preventDefault();
    const texto = campo.value.trim();
    if (!texto || consultando || terminada) return;
    const r = evalua(p, texto);
    if (r) return acaba({nv:r.nv, disp:r.disp, tuya:texto});
    // no está en el banco: lo decide el juez (IA), si responde a tiempo
    consultando = true;
    $("#aviso").textContent = "";
    const v = await juzga(p.q, texto, p.t.map(n => n.slice(0, 6).map(x => x[0])));
    consultando = false;
    if (terminada) return;
    if (v && v.valida){
      const igual = entrada(p, compacta(v.nombre));
      if (igual){
        igual.x[1].push(compacta(texto));
        return acaba({nv:igual.t, disp:igual.x[0], tuya:texto, ia:true});
      }
      // lo que da por bueno el juez cuenta entre el nivel 2 y el 5: nunca como lo más obvio
      const nv = Math.min(4, Math.max(1, (v.nivel|0) - 1));
      p.t[nv].push([v.nombre, [compacta(v.nombre), compacta(texto)]]);   // para el resto de la sesión
      return acaba({nv, disp:v.nombre, tuya:texto, ia:true});
    }
    rechaza(texto);
  });

  (function reloj(){
    const resta = Math.max(0, MS_RESP - (Date.now() - t0));
    relleno.style.transform = "scaleX(" + (resta/MS_RESP) + ")";
    seg.textContent = Math.ceil(resta/1000);
    if (resta < 5000){
      barra.classList.add("urge");
      const s = Math.ceil(resta/1000);
      if (s !== ultimoTic && s > 0){ ultimoTic = s; Son.tic(); }
    }
    if (resta <= 0) return acaba(null);
    temporizador = requestAnimationFrame(reloj);
  })();
}

function cierra(r){
  paraReloj();
  const p = J.rondas[J.i];
  const N = nivel(r), pts = N ? N.pts : 0;
  J.puntos += pts;
  J.res.push(r ? {...r, q:p.q, joyas:joyasDe(p)} : {nv:null, q:p.q, tuya:null, joyas:joyasDe(p)});
  profMeta = J.puntos; fijaPines(J.res);
  J.t0 = null; apuntaCurso("veredicto");

  if (r){ Son.baja(r.nv); if (N === NIVELES[4]) setTimeout(()=>Son.capa(), 350); } else Son.fallo();

  rescataIceberg(); escena.innerHTML = `
  <div class="panel">
    ${cabecera()}
    ${N ? `<div class="nivel" style="--nc:${N.col};--nt:${N.txt}">
             <span class="nivel-n">Nivel ${numNivel(r)}</span><span class="nivel-t">${esc(N.n)}</span>
           </div>`
        : `<div class="nivel" style="--nc:#1b2e44;--nt:#ffffff"><span class="nivel-t">Sin respuesta</span></div>`}
    ${escalera(r)}
    <p class="tuya ${r?"":"nada"}">${r ? esc(r.disp) : "Se acabó el tiempo"}</p>
    <p class="expl">${N ? esc(N.d) : "Le pasa a todo el mundo alguna vez."}</p>
    <div class="baja">
      <b>+${pts} m</b>
      <span>Llevas <strong>${mil(J.puntos)} m</strong> de ${FONDO}</span>
    </div>
    <div class="botonera">
      <button class="btn" id="bSig">${J.i+1 < RONDAS ? "Siguiente pregunta" : "Ver mi iceberg"}</button>
    </div>
  </div>`;
  trasPintar();
  $("#bSig").focus({preventScroll:true});
  $("#bSig").addEventListener("click", () => { J.i++; if (J.i < RONDAS) ronda(); else final(); });
}

// los cinco niveles en fila, con el tuyo encendido
function escalera(r){
  const k = r ? idxNivel(r) : -1;
  return `<ol class="escalera" aria-label="Nivel ${k+1} de 5">
    ${NIVELES.map((N,i)=>`<li class="${i===k?"on":""}" style="--nc:${N.col}"><span>${i+1}</span></li>`).join("")}
  </ol>`;
}

/* ═════════ lo mejor de la semana ═════════
   Las respuestas más graciosas (salen de la tabla sabihondo_fallos), una por pantalla. A cada persona le sale sola
   UNA vez, a pantalla completa, el primer día que juega desde TOP_SEMANA.fecha (al acabar la partida, o al entrar si ya
   la había acabado), durante una semana; después solo con el botón «Ver las mejores respuestas de la semana».
   Para otra semana: cambiar fecha, desde, hasta y la lista. `de` (el apodo) es opcional.
   Cuando alguien probó varias veces lo mismo, `r` es la lista de intentos en el orden en que los escribió.
   La última pantalla son los cinco que más metros han bajado entre `desde` y `hasta` (o `fecha`) (función sabihondo_semana de
   supabase/schema.sql); si la función no está o no hay nadie, esa pantalla no sale.
   Para verlo sin jugar: abrir la página con #top-semana al final de la dirección. */
const TOP_SEMANA = {fecha:"2026-10-26", desde:"2026-10-19", hasta:"2026-10-25", lista:[
  {q:"Nombra una unidad de tiempo", r:"bastante", de:"Gafas"},
  {q:"Nombra un artista que haya ido a Eurovisión por España", r:"el del gallo", de:"el goat"},

]};
// pendiente = esta semana aún no le ha salido (se marca como vista en cuanto se abre, sola o con el botón)
const topPendiente = () => { const h = hoyMadrid(), [Y,M,D] = TOP_SEMANA.fecha.split("-").map(Number);
  const fin = new Date(Date.UTC(Y, M-1, D) + 6*864e5).toISOString().slice(0,10);
  return h >= TOP_SEMANA.fecha && h <= fin && !guarda.get("top:"+TOP_SEMANA.fecha, false); };
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function diasTop(){
  const [, m1, d1] = TOP_SEMANA.desde.split("-").map(Number), [, m2, d2] = TOP_SEMANA.hasta.split("-").map(Number);
  return m1 === m2 ? `del ${d1} al ${d2} de ${MESES[m2-1]}` : `del ${d1} de ${MESES[m1-1]} al ${d2} de ${MESES[m2-1]}`;
}
function topSemana(repaso){
  guarda.set("top:"+TOP_SEMANA.fecha, true);
  const L = [{titulo:true}, ...TOP_SEMANA.lista], antes = document.activeElement;
  const velo = document.createElement("div");
  velo.className = "top-velo"; velo.setAttribute("role","dialog"); velo.setAttribute("aria-modal","true"); velo.setAttribute("aria-label","Lo mejor de la semana");
  let i = 0;
  const cierra = () => { velo.remove(); document.removeEventListener("keydown", tecla); antes?.focus?.({preventScroll:true}); };
  const pinta = () => {
    const t = L[i], ultimo = i === L.length - 1;
    const centro = t.titulo
      ? `<p class="top-titulo">Top mejores respuestas de la semana</p><p class="top-dias">${diasTop()}</p>`
      : t.filas
      ? `<p class="top-preg">Quién ha bajado más metros esta semana</p>
         <ol class="top-metros">${t.filas.map(f => `<li class="${f.eres_tu ? "tu" : ""}"><span>${f.puesto}</span><b>${esc(f.apodo)}${f.eres_tu ? " (tú)" : ""}</b><em>${mil(f.metros)} m</em></li>`).join("")}</ol>`
      : `<p class="top-preg">${esc(t.q)}</p>
         ${[].concat(t.r).map(x => `<p class="top-resp${Array.isArray(t.r) ? " varias" : ""}${/[\p{L}\p{N}]/u.test(x) ? "" : " recta"}">"${esc(x)}"</p>`).join("")}
         ${t.de ? `<p class="top-quien">de ${esc(t.de)}</p>` : ""}`;
    velo.innerHTML = `
    <div class="top-carta">
      <div>
        <div class="top-barras" aria-hidden="true">${L.map((_,k) => `<i class="${k<=i?"ya":""}"></i>`).join("")}</div>
        <div class="top-cab"><span>Lo mejor de la semana · ${i+1} de ${L.length}</span><button class="top-cerrar" type="button" aria-label="Cerrar">×</button></div>
      </div>
      <div class="top-centro" aria-live="polite">
        ${centro}
      </div>
      <div class="top-pasos">
        <button type="button" class="ant" ${i===0?"disabled":""}>Anterior</button>
        <button type="button" class="sig">${!ultimo ? "Siguiente" : repaso ? "Cerrar" : "Ver mi resultado"}</button>
      </div>
    </div>`;
    velo.querySelector(".top-cerrar").onclick = cierra;
    velo.querySelector(".ant").onclick = () => { if (i > 0){ i--; pinta(); } };
    velo.querySelector(".sig").onclick = () => { if (ultimo) cierra(); else { i++; pinta(); } };
    velo.querySelector(".sig").focus({preventScroll:true});
  };
  const tecla = e => {
    if (e.key === "Escape") cierra();
    else if (e.key === "ArrowRight" && i < L.length - 1){ i++; pinta(); }
    else if (e.key === "ArrowLeft" && i > 0){ i--; pinta(); }
  };
  document.addEventListener("keydown", tecla);
  document.body.append(velo); pinta();
  Cuenta.sb?.rpc("sabihondo_semana", {desde:TOP_SEMANA.desde, hasta:TOP_SEMANA.hasta || TOP_SEMANA.fecha}).then(({data, error}) => {
    if (error || !data?.length || !velo.isConnected) return;
    L.push({filas:data.slice(0,5)}); pinta();
  }, () => {});
}
if (location.hash === "#top-semana") addEventListener("load", () => setTimeout(topSemana, 400));

const WEB = "norahmartinn.github.io/sabihondo";
/* Se comparte solo el mensaje, con el enlace dentro. Con la imagen, el iPhone al «Copiar» copiaba las imágenes
   y perdía el enlace, y WhatsApp a veces tampoco lo mandaba; el enlace ya enseña la vista previa (etiquetas og: de arriba). */
function textoCompartir(metros, res){
  const emojis = res.map(r => nivel(r) ? nivel(r).e : FALLO).join("");
  return `He bajado ${mil(metros)} m en Sabihondo 🧊\n${emojis}\n¿Y tú hasta dónde bajas? https://${WEB}/`;
}
async function compartir(texto, boton){
  try{ if (navigator.share) return await navigator.share({text:texto}); }
  catch(e){ if (e && e.name === "AbortError") return; }
  try{
    await navigator.clipboard.writeText(texto);
    const antes = boton.innerHTML; boton.textContent = "¡Copiado! Pégalo donde quieras";
    setTimeout(() => { boton.innerHTML = antes; }, 2500);
  }catch{}
}

/* todas las respuestas válidas de una pregunta, agrupadas por nivel.
   Las listas pueden tener miles: se enseñan las más conocidas y el total. */
const MAX_VER = 60;
async function todasLas(r){
  const i = PREGUNTAS.findIndex(x => x.q === r.q);
  if (i < 0) return `<p class="mini">Esta pregunta ya no está en el banco.</p>`;
  const p = await cargaPregunta(i);
  const tuya = nivel(r) ? compacta(r.disp) : null;
  return NIVELES.map((N,k) => {
    const todas = p.t[k].map(x => x[0]);
    if (!todas.length) return "";
    let lista = todas.slice(0, MAX_VER);
    const mia = tuya && todas.find(x => compacta(x) === tuya);
    if (mia && !lista.includes(mia)) lista.push(mia);
    lista = lista.sort((x,y) => x.localeCompare(y,"es"));
    const resto = todas.length - lista.length;
    return `<div class="grupo">
      <div class="grupo-cab"><span class="tag" style="--nc:${N.col};--nt:${N.txt};margin:0">Nivel ${k+1} · ${esc(N.n)}</span>
        <span class="pt">+${N.pts} m · ${mil(todas.length)}</span></div>
      <p class="resps">${lista.map(x => compacta(x) === tuya
          ? `<mark style="--nc:${N.col}">${esc(x)}</mark>` : esc(x)).join(" · ")}${resto > 0 ? ` <span class="mas">y ${mil(resto)} más</span>` : ""}</p>
    </div>`;
  }).join("");
}

/* ═════════ el juez: respuestas que no están en el banco ═════════ */
async function juzga(pregunta, respuesta, ejemplos){
  const ctrl = new AbortController(), plazo = setTimeout(() => ctrl.abort(), 6000);
  try{
    const r = await fetch(SB_URL + "/functions/v1/sabihondo-juez", {
      method:"POST", signal:ctrl.signal,
      headers:{"Content-Type":"application/json", apikey:SB_KEY, Authorization:"Bearer " + SB_KEY},
      body:JSON.stringify({pregunta, respuesta, ejemplos})
    });
    return r.ok ? await r.json() : null;
  }catch{ return null; }
  finally{ clearTimeout(plazo); }
}

async function cargaPartidas(){

// las partidas jugadas en este navegador antes de entrar se suben a la cuenta
async function subeLocales(uid){
  const filas = {};
  try{
    for (let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i), m = k && k.match(/^(?:sabihondo|krillon):hecho:(\d{4}-\d{2}-\d{2})$/);
      if (!m) continue;
      const h = JSON.parse(localStorage.getItem(k));
      if (h && typeof h.puntos === "number" && vigente(h, m[1])) filas[m[1]] = {user_id:uid, fecha:m[1], dia:h.dia ?? numeroDia(m[1]), puntos:h.puntos, res:h.res || []};
    }
  }catch{}
  const lista = Object.values(filas);
  if (!lista.length) return;
  const {error} = await Cuenta.sb.from(TABLA).upsert(lista, {onConflict:"user_id,fecha", ignoreDuplicates:true});
  if (error) console.warn("Sabihondo: no se pudieron subir las partidas locales", error);
}

async function guardaEnNube(p){
  if (!Cuenta.user) return;
  if (Cuenta.partidas && !Cuenta.partidas.some(x => x.fecha === p.fecha)) Cuenta.partidas.unshift(p);
  const {error} = await Cuenta.sb.from(TABLA).upsert([{user_id:Cuenta.user.id, ...p}], {onConflict:"user_id,fecha", ignoreDuplicates:true});
  if (error) console.warn("Sabihondo: no se pudo guardar la partida", error);
  cargaRecord();
}

const apodoDe = u => ((u && u.user_metadata && u.user_metadata.apodo) || "").trim();
const logueado = () => !!(Cuenta.user && Cuenta.partidas);
function hechoHoy(){
  const hoy = hoyMadrid();
  const local = guarda.get("hecho:" + hoy, null), suya = vigente(local, hoy) ? local : null;
  if (logueado()){ const nube = Cuenta.partidas.find(p => p.fecha === hoy); return (nube && !deOtroDia(nube, hoy) ? nube : null) || suya; }
  return suya;
}
function stats(){
  if (!logueado()) return guarda.get("est", {jugadas:0, racha:0, mejorRacha:0, mejor:0, ultima:null});
  const n = f => { const [y,m,d] = f.split("-").map(Number); return Date.UTC(y,m-1,d)/864e5; };
  const locales = [];
  try{ for (let i=0;i<localStorage.length;i++){ const m = (localStorage.key(i)||"").match(/^(?:sabihondo|krillon):hecho:(\d{4}-\d{2}-\d{2})$/); if (m) locales.push(m[1]); } }catch{}
  const dias = [...new Set([...Cuenta.partidas.map(p => p.fecha), ...locales].map(n))].sort((a,b)=>a-b);
  let mejorRacha = 0, tramo = 0;
  dias.forEach((d,i) => { tramo = i && d === dias[i-1]+1 ? tramo+1 : 1; mejorRacha = Math.max(mejorRacha, tramo); });
  const hoy = n(hoyMadrid()), ultimo = dias[dias.length-1];
  const local = guarda.get("est", {racha:0, mejorRacha:0, ultima:null});
  const localViva = local.ultima && n(local.ultima) >= hoy-1 ? local.racha : 0;
  const racha = Math.max(dias.length && ultimo >= hoy-1 ? tramo : 0, localViva);
  return {jugadas:dias.length, racha, mejorRacha:Math.max(mejorRacha, racha, local.mejorRacha || 0), mejor:Math.max(0, ...Cuenta.partidas.map(p => p.puntos))};
}

  }
}

const errorEs = e => {
  const m = (e && e.message || "").toLowerCase();
  if (m.includes("invalid login")) return "El email o la contraseña no coinciden.";
  if (m.includes("already registered") || m.includes("already been registered")) return "Ya hay una cuenta con ese email. Entra con tu contraseña.";
  if (m.includes("password") && m.includes("6")) return "La contraseña necesita al menos 6 caracteres.";
  if (m.includes("email") && m.includes("invalid")) return "Ese email no parece válido.";
  if (m.includes("not confirmed")) return "Tienes que confirmar el email antes de entrar. Revisa tu correo.";
  if (m.includes("rate") || m.includes("too many") || m.includes("security purposes")) return "Demasiados intentos seguidos. Espera un rato y prueba otra vez.";
  if (m.includes("different from the old")) return "La contraseña nueva tiene que ser distinta de la anterior.";
  return "No se ha podido: " + (e && e.message || "error desconocido");
};

      <div class="marcador">
        <div>Racha<b>${est.racha}</b></div>
        <div>Mejor racha<b>${est.mejorRacha}</b></div>
        <div>Partidas<b>${est.jugadas}</b></div>
        <div>Récord<b>${mil(est.mejor)} m</b></div>
      </div>
      <h3>Tus partidas</h3>
      ${!ps ? `<p class="mini">Cargando…</p>`
        : !ps.length ? `<p class="mini">Aún no has jugado ningún reto con esta cuenta.</p>`
        : `<ul class="historial">${ps.map(p => `<li>
            <span class="h-dia">Nº ${esc(p.dia)}<small>${esc(p.fecha.split("-").reverse().slice(0,2).join("/"))}</small></span>
            <span class="h-nv">${(p.res||[]).map(r => { const N = nivel(r);
              return `<i style="background:${N ? N.col : "#1b2e44"}" title="${N ? "Nivel " + numNivel(r) : "Sin respuesta"}"></i>`; }).join("")}</span>
            <span class="h-m">${mil(p.puntos)} m</span></li>`).join("")}</ul>`}
      <div class="botonera">
        <button class="btn" id="bCerrarC">Volver</button>
        <button class="btn fantasma" id="bSalir">Cerrar sesión</button>
      </div>
    </div>`;
    $("#cuentaEmail").textContent = "Has entrado como " + (Cuenta.user.email || "");
    $("#cApodoMio").value = apodoDe(Cuenta.user);
    if (!apodoDe(Cuenta.user)) $("#aApodo").textContent = "Ponte un apodo para salir con nombre si haces el récord del día.";
    $("#fApodo").addEventListener("submit", async e => {
      e.preventDefault();
      const apodo = $("#cApodoMio").value.trim().slice(0,20), aviso = $("#aApodo"), boton = $("#bApodo");
      if (apodo.length < 2){ aviso.textContent = "El apodo necesita al menos 2 letras."; return; }
      boton.disabled = true; aviso.textContent = "Guardando…";
      const {data, error} = await Cuenta.sb.auth.updateUser({data:{apodo}});
      boton.disabled = false;
      if (error){ aviso.textContent = errorEs(error); return; }
      if (data && data.user) Cuenta.user = data.user;
      aviso.textContent = "Guardado."; pintaBotonCuenta(); cargaRecord();
    });
    $("#bSalir").addEventListener("click", async () => { await Cuenta.sb.auth.signOut(); abreCuenta(false); });
  } else {
    if (Cuenta.modo === "olvido"){
      caja.innerHTML = `
      <div class="panel">
        <h2>Restablece tu contraseña</h2>
        <p class="mini">Escribe el email de tu cuenta y te mandamos un correo con un enlace para poner una contraseña nueva.</p>
        <form id="fOlvido" class="form-cuenta">
          <label for="cEmailOlvido">Email</label>
          <input type="email" id="cEmailOlvido" autocomplete="email" required placeholder="tu@email.com">
          <button class="btn" type="submit" id="bOlvido">Enviar enlace</button>
          <p class="aviso" id="aOlvido" role="status"></p>
        </form>
        <div class="botonera"><button class="btn fantasma" id="bVolverEntrar" type="button">Volver a entrar</button>
          <button class="btn fantasma" id="bCerrarC">Cerrar</button></div>
      </div>`;
      $("#bVolverEntrar").addEventListener("click", () => abreCuenta(true, "entrar"));
      $("#fOlvido").addEventListener("submit", async e => {
        e.preventDefault();
        const aviso = $("#aOlvido"), boton = $("#bOlvido");
        boton.disabled = true; aviso.textContent = "Enviando…";
        const {error} = await Cuenta.sb.auth.resetPasswordForEmail($("#cEmailOlvido").value.trim(), {redirectTo: location.origin + location.pathname});
        boton.disabled = false;
        aviso.textContent = error ? errorEs(error)
          : "Si hay una cuenta con ese email, te llegará un correo en unos minutos. Mira también en la carpeta de spam.";
      });
      $("#cEmailOlvido").focus();
      $("#bCerrarC").addEventListener("click", () => abreCuenta(false));
      return;
    }
    const alta = Cuenta.modo === "alta";
    caja.innerHTML = `
    <div class="panel">
      <h2>${alta ? "Crea tu cuenta" : "Entra en tu cuenta"}</h2>
      <p class="mini">Con una cuenta, tu racha y todas tus partidas quedan guardadas y las ves desde cualquier móvil u ordenador. Las que ya has jugado en este navegador se suben solas.</p>
      <div class="pestanas" role="tablist">
        <button type="button" role="tab" id="tEntrar" aria-selected="${!alta}">Ya tengo cuenta</button>
        <button type="button" role="tab" id="tAlta" aria-selected="${alta}">Crear cuenta</button>
      </div>
      <form id="fCuenta" class="form-cuenta">
        ${alta ? `<label for="cApodo">Apodo</label>
        <input type="text" id="cApodo" autocomplete="nickname" required minlength="2" maxlength="20" placeholder="Así sales si haces el récord del día">` : ``}
        <label for="cEmail">Email</label>
        <input type="email" id="cEmail" autocomplete="email" required placeholder="tu@email.com">
        <label for="cPass">Contraseña</label>
        <input type="password" id="cPass" autocomplete="${alta ? "new-password" : "current-password"}" required minlength="6"
               placeholder="${alta ? "mínimo 6 caracteres" : ""}">
        <button class="btn" type="submit" id="bEnviar">${alta ? "Crear cuenta" : "Entrar"}</button>
        ${alta ? `` : `<button class="enlace" type="button" id="bOlvide" style="justify-self:start;margin-top:10px">¿Has olvidado tu contraseña?</button>`}
        <p class="aviso" id="cAviso" role="status"></p>
      </form>
      <div class="botonera"><button class="btn fantasma" id="bCerrarC">Volver</button></div>
    </div>`;
    $("#tEntrar").addEventListener("click", () => abreCuenta(true, "entrar"));
    $("#tAlta").addEventListener("click", () => abreCuenta(true, "alta"));
    $("#bOlvide")?.addEventListener("click", () => abreCuenta(true, "olvido"));
    $("#fCuenta").addEventListener("submit", async e => {
      e.preventDefault();
      const email = $("#cEmail").value.trim(), password = $("#cPass").value, aviso = $("#cAviso"), boton = $("#bEnviar");
      boton.disabled = true; aviso.textContent = alta ? "Creando la cuenta…" : "Entrando…";
      const {data, error} = alta
        ? await Cuenta.sb.auth.signUp({email, password, options:{data:{apodo:$("#cApodo").value.trim().slice(0,20)}}})
        : await Cuenta.sb.auth.signInWithPassword({email, password});
      boton.disabled = false;
      if (error){ aviso.textContent = errorEs(error); return; }
      if (alta && !data.session){ aviso.textContent = "Cuenta creada. Te hemos mandado un correo para confirmarla; ábrelo y luego entra aquí."; return; }
      aviso.textContent = "";
    });
    (alta ? $("#cApodo") : $("#cEmail")).focus();
  }
  $("#bCerrarC").addEventListener("click", () => abreCuenta(false));
}
$("#bCuenta").addEventListener("click", () => abreCuenta($("#cuenta").hidden));

/* ═════════ aviso: añadir Sabihondo a la pantalla de inicio ═════════
   Sale una vez, solo el día AVISO_INICIO, en el móvil y si no se ha abierto ya desde el icono.
   En iPhone solo se puede desde Safari: si está en otro navegador (Chrome, Instagram…), se le dice que lo abra en Safari. */
const AVISO_INICIO = "2026-10-23";
const instalada = () => navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
function quiereInstalar(){
  if (location.hash === "#inicio") return true;
  return hoyMadrid() === AVISO_INICIO && !instalada() && matchMedia("(pointer: coarse)").matches && !guarda.get("inicio:"+AVISO_INICIO, false);
}
function avisoInicio(){
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const android = /Android/.test(ua);
  const otroNavegador = ios && /CriOS|FxiOS|EdgiOS|OPiOS|GSA|Instagram|FBAN|FBAV|TikTok|Line|Snapchat|Twitter/.test(ua);
  const flecha = `<svg class="ico-safari" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9H6a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10a1 1 0 0 0-1-1h-2"/><path d="M12 15V3"/><path d="M8.5 6.5 12 3l3.5 3.5"/></svg>`;
  const mas = `<svg class="ico-safari" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/></svg>`;
  const caja = $("#ayuda"); caja.hidden = false; caja.scrollTop = 0;
  caja.innerHTML = `
  <div class="panel aviso-inicio">
    <h2>Ten Sabihondo en tu pantalla de inicio</h2>
    <div class="icono-inicio" aria-hidden="true"><img src="iconos/apple-touch-icon.png?v=2" alt="" width="76" height="76"><span>Sabihondo</span></div>
    ${android ? `
    <ol class="pasos-inicio">
      <li>Abre el menú <b>⋮</b> de Chrome, arriba a la derecha.</li>
      <li>Pulsa <b>Añadir a pantalla de inicio</b> (o <b>Instalar aplicación</b>).</li>
    </ol>` : `
    <p class="ojo-safari"><b>Tiene que ser desde Safari.</b></p>
    ${otroNavegador ? `<p class="mini">Ahora mismo no estás en Safari: copia el enlace, ábrelo en Safari y sigue estos pasos.</p>
    <div class="botonera"><button class="btn fantasma" id="bCopiaWeb">Copiar enlace</button></div>` : ``}
    <ol class="pasos-inicio">
      <li>En Safari, pulsa el botón de <b>compartir</b> ${flecha} de la barra de abajo. Si no ves la barra, toca abajo del todo de la pantalla (o pulsa <b>···</b> y luego compartir).</li>
      <li>Baja y pulsa <b>Añadir a pantalla de inicio</b> ${mas}.</li>
    </ol>`}
    <div class="botonera"><button class="btn" id="bCerrar">Entendido</button></div>
    <p class="aviso" id="avisoWeb" role="status"></p>
  </div>`;
  $("#bCerrar").addEventListener("click", () => ayuda(false));
  $("#bCopiaWeb")?.addEventListener("click", async () => {
    try{ await navigator.clipboard.writeText(`https://${WEB}/`); $("#avisoWeb").textContent = "Enlace copiado. Pégalo en Safari."; }
    catch{ $("#avisoWeb").textContent = `https://${WEB}/`; }
  });
  $("#bCerrar").focus({preventScroll:true});
}

/* ═════════ ayuda ═════════ */
function ayuda(abrir){
  const caja = $("#ayuda");
  if (!abrir){ caja.hidden = true; caja.innerHTML = ""; return; }
  caja.hidden = false;
  caja.innerHTML = `
  <div class="panel">
    <h2>Cómo se juega</h2>
    <p class="mini">Te salen siete enunciados abiertos y escribes <b>una</b> respuesta a cada uno antes de que se acabe el tiempo. Todas las respuestas correctas cuentan. Lo que cambia es cuánta gente diría la tuya: cuanto menos, más metros bajas por el iceberg.</p>
    <h3>Los cinco niveles</h3>
    <ul class="escala">
      ${NIVELES.map((N,i)=>`<li><span class="tag" style="--nc:${N.col};--nt:${N.txt};margin:0">Nivel ${i+1}</span>
        <span><span class="n">${N.n}</span><span class="d">${esc(N.d)}</span></span>
        <span class="p">+${N.pts} m</span></li>`).join("")}
    </ul>
    <div class="botonera"><button class="btn" id="bCerrar">Volver</button>
      ${pantalla === "juego" ? "" : `<button class="btn fantasma" id="bVerTuto">Ver el tutorial</button>`}</div>
  </div>`;
  caja.scrollTop = 0;
  $("#bCerrar").focus({preventScroll:true});
  $("#bCerrar").addEventListener("click", ()=>ayuda(false));
  $("#bVerTuto")?.addEventListener("click", () => { ayuda(false); tutorial(); });
}
$("#bAyuda").addEventListener("click", ()=>ayuda($("#ayuda").hidden));

/* ═════════ ranking del día: quien tiene cuenta, con su apodo ═════════ */
async function ranking(vista = "hoy"){
  // el podio semanal se estrena el domingo 11; antes solo se ve abriendo la página con #podio-semanal
  const haySemanal = hoyMadrid() >= "2026-10-11" || location.hash === "#podio-semanal";
  const caja = $("#ayuda"), semana = haySemanal && vista === "semana";
  caja.hidden = false; caja.scrollTop = 0;
  const marco = cuerpo => { caja.innerHTML = `
    <div class="panel">
      ${semana ? `<div class="cab-podio"><h2>Podio semanal</h2><button type="button" class="directo" id="bDirecto" title="Actualizar el podio"><i aria-hidden="true"></i>En directo</button></div>`
               : `<h2>Podio de hoy</h2>`}
      ${haySemanal ? `<div class="pestanas" role="tablist">
        <button type="button" role="tab" id="bPodioHoy" aria-selected="${!semana}">Hoy</button>
        <button type="button" role="tab" id="bPodioSemana" aria-selected="${semana}">Podio semanal</button>
      </div>` : ``}
      ${hoyMadrid() >= TOP_SEMANA.fecha || location.hash === "#podio-semanal" ? `<button class="btn fantasma ver-top" id="bVerTop">Ver las mejores respuestas de la semana</button>` : ``}
      ${cuerpo}
      <div class="botonera"><button class="btn" id="bCerrar">Volver</button>
        ${Cuenta.user ? "" : `<button class="btn fantasma" id="bRankCuenta">Crear una cuenta</button>`}</div>
    </div>`;
    $("#bCerrar").addEventListener("click", () => ayuda(false));
    $("#bDirecto")?.addEventListener("click", () => ranking("semana"));
    $("#bVerTop")?.addEventListener("click", () => { ayuda(false); topSemana(true); });
    $("#bPodioHoy")?.addEventListener("click", () => { if (semana) ranking("hoy"); });
    $("#bPodioSemana")?.addEventListener("click", () => { if (!semana) ranking("semana"); });
    $("#bRankCuenta")?.addEventListener("click", () => { ayuda(false); abreCuenta(true, "alta"); });
  };
  marco(`<p class="mini">Cargando…</p>`);
  $(semana ? "#bPodioSemana" : "#bCerrar").focus({preventScroll:true});
  let filas = null;
  try{
    const {data, error} = semana ? await Cuenta.sb.rpc("sabihondo_semana", {desde:lunesDe(hoyMadrid()), hasta:hoyMadrid()})
                                 : await Cuenta.sb.rpc("sabihondo_ranking", {dia:hoyMadrid()});
    if (!error) filas = data;
  }catch{}
  // si mientras cargaba se ha cerrado o se ha cambiado de pestaña, esta respuesta ya no pinta nada
  if (caja.hidden || semana !== ($("#bPodioSemana")?.getAttribute("aria-selected") === "true")) return;
  if (!filas) return marco(`<p class="mini">Ahora mismo no se puede cargar el podio. Prueba dentro de un rato.</p>`);
  if (!filas.length) return marco(semana
    ? `<p class="mini"><b>Esta semana todavía no ha jugado nadie con cuenta.</b></p>`
    : `<p class="mini"><b>Todavía no ha jugado nadie con cuenta.</b> El primero que termine la partida de hoy se pone líder.</p>`);
  marco(`${semana ? `<p class="mini">Metros totales sumergidos esta semana</p>` : ``}
    <ol class="ranking">${filas.map(f => `<li class="${f.eres_tu ? "tu" : ""}">
      <span class="puesto">${esc(f.puesto)}</span>
      <span class="quien">${esc(f.apodo)}${f.eres_tu ? " (tú)" : ""}</span>
      <span class="metros">${mil(semana ? f.metros : f.puntos)} m</span></li>`).join("")}</ol>
    ${Cuenta.user ? "" : `<p class="mini">Para salir aquí hace falta una cuenta.</p>`}`);
}
if (location.hash === "#podio-semanal") addEventListener("load", () => setTimeout(() => ranking("semana"), 600));
// el lunes de la semana de una fecha AAAA-MM-DD
function lunesDe(fecha){
  const [Y,M,D] = fecha.split("-").map(Number), d = new Date(Date.UTC(Y, M-1, D));
  d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7);
  return d.toISOString().slice(0,10);
}
$("#bRanking").addEventListener("click", () => $("#ayuda").hidden ? ranking() : ayuda(false));
addEventListener("keydown", e => { if (e.key === "Escape"){ ayuda(false); abreCuenta(false); } });

const bs = $("#bSon");
bs.setAttribute("aria-pressed", String(Son.activo()));
bs.textContent = Son.activo() ? "♪" : "✕";
bs.addEventListener("click", ()=>{ const on = Son.alterna(); bs.setAttribute("aria-pressed", String(on)); bs.textContent = on ? "♪" : "✕"; });

/* ═════════ arranque ═════════ */
dibujaIceberg();
requestAnimationFrame(anima);
if (guarda.get("tutorial", false) || guarda.get("est", null)) portada(); else tutorial();
// con el reto de hoy a medias se vuelve directo a la pregunta: el reloj de esa pregunta no ha parado
if (enCurso()){ guarda.set("tutorial", true); empieza("diaria"); }
iniciaCuenta();
// La librería de cuentas se pide después de pintar: si su servidor tarda o está bloqueado, se juega igual sin cuenta.
(function(){
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"; s.async = true;
  s.onload = () => { iniciaCuenta(); if (pantalla === "portada") portada(); };
  document.head.appendChild(s);
})();
document.fonts?.ready.then(() => mueveMarca());
</script>
